services:
  faro:
    build: .
    restart: unless-stopped
    environment:
      FARO_ORIGIN: https://${FARO_DOMAIN:?Configura FARO_DOMAIN}
      FARO_PROXY_KEY: ${FARO_PROXY_KEY:?Configura FARO_PROXY_KEY}
      FARO_DATA_DIR: /var/lib/faro
      FARO_STARTUP_CONFIG: /run/faro-secrets/config.json
    volumes:
      - faro-data:/var/lib/faro
      - ./faro-secrets:/run/faro-secrets:ro
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      FARO_DOMAIN: ${FARO_DOMAIN:?Configura FARO_DOMAIN}
      FARO_PROXY_KEY: ${FARO_PROXY_KEY:?Configura FARO_PROXY_KEY}
      FARO_LOGIN: ${FARO_LOGIN:?Configura FARO_LOGIN}
      FARO_PASSWORD_HASH: ${FARO_PASSWORD_HASH:?Configura FARO_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  faro-data:
  caddy-data:
  caddy-config:
