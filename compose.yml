services:
  pacosat:
    build: .
    restart: unless-stopped
    environment:
      PACOSAT_ORIGIN: https://${PACOSAT_DOMAIN:?Configura PACOSAT_DOMAIN}
      PACOSAT_PROXY_KEY: ${PACOSAT_PROXY_KEY:?Configura PACOSAT_PROXY_KEY}
      PACOSAT_DATA_DIR: /var/lib/pacosat
      PACOSAT_STARTUP_CONFIG: /run/pacosat-secrets/config.json
    volumes:
      - pacosat-data:/var/lib/pacosat
      - ./pacosat-secrets:/run/pacosat-secrets:ro
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      PACOSAT_DOMAIN: ${PACOSAT_DOMAIN:?Configura PACOSAT_DOMAIN}
      PACOSAT_PROXY_KEY: ${PACOSAT_PROXY_KEY:?Configura PACOSAT_PROXY_KEY}
      PACOSAT_LOGIN: ${PACOSAT_LOGIN:?Configura PACOSAT_LOGIN}
      PACOSAT_PASSWORD_HASH: ${PACOSAT_PASSWORD_HASH:?Configura PACOSAT_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  pacosat-data:
  caddy-data:
  caddy-config:
