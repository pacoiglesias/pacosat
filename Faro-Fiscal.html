const cloudStorage = Boolean(document.querySelector('meta[name="pacosat-cloud"]'));
let previewUrl;





const cloudCache = new Map(), cloudMarks = new Map();
async function cloudRead(store, id) {
  const decode = item => item && store === 'files' ? { id: item.id,
    blob: new Blob([decode64(item.content)], { type: item.mime }) } : item;
  if (id !== undefined) {
    const query = new URLSearchParams({ store, id });
    const value = await satApi('storage?' + query);
    return decode(value);
  }
  const since = cloudMarks.get(store);
  if (since === undefined) {
    const { rev } = await satApi('storage/rev');
    const value = await satApi('storage?' + new URLSearchParams({ store }));
    const map = new Map((Array.isArray(value) ? value : []).map(item => { const decoded = decode(item); return [decoded.id, decoded]; }));
    cloudCache.set(store, map);
    cloudMarks.set(store, rev);
    return [...map.values()];
  }
  const diff = await satApi('storage?' + new URLSearchParams({ store, since: String(since) }));
  const map = cloudCache.get(store) || new Map();
  for (const item of diff.rows || []) { const decoded = decode(item); map.set(decoded.id, decoded); }
  for (const deletedId of diff.deleted || []) map.delete(deletedId);
  cloudCache.set(store, map);
  cloudMarks.set(store, diff.rev);
  return [...map.values()];
}
async function cloudWrite(batch, replace) {
  const data = { ...batch };
  if (batch.files) data.files = await Promise.all(batch.files.map(async file => ({
    id: file.id, mime: file.blob.type, content: encode64(bytes(await file.blob.arrayBuffer()))
  })));
  await satApi('storage', { batch: data, replace });
  for (const store of Object.keys(batch)) cloudMarks.delete(store);
}

async function importInvoicePdf(file) {
  await requireStorage();
  check(people.length, 'Agrega un contribuyente antes de importar una factura PDF.');
  check(await pdfOk(file), 'Elige un PDF válido de hasta 15 MB.');
  let result = { uuids: [], rfcs: [], hasText: false }, failure = '';
  if (satToken) {
    announce('Leyendo folios fiscales en el PDF…');
    try { result = await satApi('pdf-analyze', { data: encode64(bytes(await file.arrayBuffer())) }); }
    catch (error) { failure = error.message; }
  }
  const candidates = Array.isArray(result.uuids) ? result.uuids : [];
  const known = Array.isArray(result.rfcs) ? result.rfcs : [];
  const automatic = candidates.length === 1 ? candidates[0] : '';
  const match = invoices.find(row => row.id === automatic);
  const belongs = candidate => !match || [match.from.rfc, match.to.rfc].includes(candidate);
  const applicable = people.filter(person => belongs(person.id));
  check(applicable.length, 'El XML vinculado pertenece a otro expediente.');
  const suitable = applicable.filter(p => known.includes(p.id));
  const options = [['', 'Selecciona un RFC'], ...applicable.map(p => [p.id, p.name + ' · ' + p.id])];
  const taxpayer = select(options, scope && applicable.some(p => p.id === scope) ? scope :
    suitable.length === 1 ? suitable[0].id : applicable.length === 1 ? applicable[0].id : '');
  taxpayer.required = true;
  const issueDate = input('date', { value: match?.date.slice(0, 10) || '', required: true });
  const folio = input('text', { value: automatic, maxLength: 36, placeholder: 'UUID del CFDI, si está disponible' });
  if (scope && ((match && !belongs(scope)) || (!match && known.length && !known.includes(scope)))) {
    announce('El PDF no corresponde al RFC seleccionado ' + scope + '. RFC detectados: ' + (known.join(', ') || [match.from.rfc, match.to.rfc].join(', ')), true);
    return viewPdfFile(file);
  }
  const note = failure || (automatic ? match ? 'Encontré el XML del mismo UUID. Revisa los datos para vincular la representación impresa.' :
    'Detecté un UUID. El PDF se vinculará cuando exista el XML correspondiente.' :
    candidates.length ? 'El PDF contiene varios UUID. Escribe el folio correcto para vincularlo.' :
    'No pude identificar un UUID. Si es un escaneo, captura el folio manualmente o guarda el PDF sin vincular.');
  reportPdfState(note);
  dialog('Archivar factura PDF', [cell(file.name, note), field('Expediente', taxpayer),
    field('Fecha del comprobante', issueDate), field('UUID (opcional)', folio)], async () => {
    const uuid = folio.value.trim().toUpperCase();
    check(!uuid || UUID.test(uuid), 'El UUID debe tener 36 caracteres en formato de folio fiscal.');
    const linked = invoices.find(row => row.id === uuid);
    check(!linked || [linked.from.rfc, linked.to.rfc].includes(taxpayer.value), 'El XML de ese UUID corresponde a otro RFC.');
    check(!known.length || linked || known.includes(taxpayer.value), 'El RFC seleccionado no aparece en el PDF.');
    check(!uuid || !documents.some(doc => doc.kind === 'Factura PDF' && doc.rfc === taxpayer.value && doc.uuid === uuid),
      'Ese UUID ya tiene una factura PDF en este expediente.');
    const id = 'pdf:' + crypto.randomUUID();
    const row = { id, rfc: taxpayer.value, kind: 'Factura PDF', date: issueDate.value,
      period: '', name: file.name.slice(0, 180), uuid };
    await writeBatch({ documents: [row], files: [{ id, blob: new Blob([file], { type: 'application/pdf' }) }] });
    docFilter = 'Factura PDF';
    if (scope && scope !== taxpayer.value) scope = taxpayer.value;
    await refresh(); navigate('docs');
    announce(linked ? 'PDF archivado y vinculado al XML.' : 'Factura PDF archivada.');
  });
}

  const sysHealth = panel('Salud del sistema');

  for (const profile of (satData.profiles || []).filter(p => !scope || p.rfc === scope)) {

    (sb.verify ? ' · prueba de restauración: ' + (sb.verify.ok ? 'íntegra' : 'CON FALLO') : '') : 'Respaldo programado sin configurar']);
  healthRows.push(['Expediente', number.format(people.length) + ' RFC · ' + number.format(invoices.length) + ' CFDI · ' +
    number.format(documents.length) + ' documentos · ' + number.format(activity.length) + ' registros de bitácora']);
  

  if (satToken && sb.secondary) healthRows.push(['Copia externa (Google Drive)',
    sb.secondaryLastOk ? (sb.secondaryStale ? '⚠ Lleva más de 7 días: última buena el ' : 'Al día: última buena el ') +
      localDateTime(sb.secondaryLastOk) : '⚠ Aún no consta ninguna copia buena en el destino externo']);
  sysHealth.append(grid(['Elemento', 'Estado'], healthRows));
  return [health, sysHealth, selfTestPanel(), activityPanel(), alerts, reconcile];
}

async function importBatch(source, requiredRfc = scope, { quiet = false, fromFolder = false } = {}) {
  if (importing) return;
  try { await requireStorage(); }
  catch (error) { if (quiet) throw error; announce(error.message, true); return; }
  



  const allFiles = [...source];
  const files = allFiles.filter(file => /\.(xml|zip)$/i.test(file.name));
  const skipped = fromFolder
    ? allFiles.filter(file => !/\.(xml|zip)$/i.test(file.name)).slice(0, 20)
        .map(file => ({ name: file.name.slice(0, 180), reason: 'No es un XML ni un ZIP de CFDI: no se procesó.' }))
    : [];
  if (!files.length) return announce(fromFolder && skipped.length
    ? 'La carpeta no trae XML ni ZIP de CFDI (' + skipped.length + ' archivos de otro tipo, sin procesar).'
    : 'Elige archivos .xml o .zip con CFDI.', true);
  if (!people.length) return announce('Agrega primero los RFC que quieres importar.', true);
  importing = true;
  $('primary').disabled = true;
  

  let totalUnits = files.length, doneUnits = 0;
  if (!quiet) activityStart(fromFolder ? 'Importando carpeta de comprobantes' : 'Importando comprobantes', totalUnits);
  let added = 0, duplicates = 0, review = 0, scopeRejected = 0;
  let nuevosEmitidos = 0, nuevosRecibidos = 0;
  const nuevosPorMes = new Map();
  const dupIds = [];
  const issues = [];
  const pending = new Map();
  const known = scopes();
  const seen = new Set((await readStore('invoices').catch(() => invoices)).map(row => row.id));
  let pendingSize = 0;
  const issue = (name, error) => {
    review++;
    if (issues.length < 20) issues.push({ name: name.slice(0, 180), reason: error.message.slice(0, 320) });
  };
  async function flush() {
    if (!pending.size) return;
    await writeBatch({ invoices: [...pending.values()].map(item => item.row), files: [...pending.values()].map(item => item.file) });
    added += pending.size;
    pending.clear();
    pendingSize = 0;
  }
  async function accept(name, xml) {
    let row;
    try {
      row = withFiscal(parseXml(xml), xml);
      check(!requiredRfc || row.from.rfc === requiredRfc || row.to.rfc === requiredRfc,
        'No corresponde a ' + requiredRfc + '. Emisor ' + row.from.rfc + ' · Receptor ' + row.to.rfc + '.');
      check(known.has(row.from.rfc) || known.has(row.to.rfc), 'Los RFC del comprobante no están registrados.');
    } catch (error) {
      


      if (String(error.message).startsWith('No corresponde a')) scopeRejected++;
      issue(name, error); return;
    }
    if (seen.has(row.id)) { duplicates++; if (dupIds.length < 50) dupIds.push(row.id); return; }
    seen.add(row.id);
    
    if (known.has(row.from.rfc)) nuevosEmitidos++; else if (known.has(row.to.rfc)) nuevosRecibidos++;
    const monthKey = String(row.date || '').slice(0, 7);
    if (/^\d{4}-\d{2}$/.test(monthKey)) nuevosPorMes.set(monthKey, (nuevosPorMes.get(monthKey) || 0) + 1);
    pending.set(row.id, { row, file: { id: 'xml:' + row.id, blob: new Blob([xml], { type: 'application/xml' }) } });
    pendingSize += xml.length;
    if (pending.size >= 100 || pendingSize >= 12 * MB) await flush();
  }
  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (!quiet) announce('Importando ' + (i + 1) + ' de ' + files.length + ' · ' + file.name);
      if (/\.xml$/i.test(file.name)) {
        if (file.size > 8 * MB) { issue(file.name, new Error('El XML supera 8 MB.')); doneUnits++; if (!quiet) activityProgress(doneUnits, file.name); continue; }
        let xml;
        try { xml = bytes(await file.arrayBuffer()); }
        catch (error) { issue(file.name, error); doneUnits++; if (!quiet) activityProgress(doneUnits, file.name); continue; }
        await accept(file.name, xml);
        doneUnits++;
        if (!quiet) activityProgress(doneUnits, file.name);
      } else {
        if (file.size > 80 * MB) { issue(file.name, new Error('El ZIP supera 80 MB.')); doneUnits++; if (!quiet) activityProgress(doneUnits, file.name); continue; }
        


        const meta = {};
        let zip;
        try { zip = zipXml(bytes(await file.arrayBuffer()), meta); }
        catch (error) { issue(file.name, error); doneUnits++; if (!quiet) activityProgress(doneUnits, file.name); continue; }
        let count = 0, expanded = false;
        while (true) {
          let entry;
          try { entry = await zip.next(); }
          catch (error) { issue(file.name, error); break; }
          if (!expanded && meta.total) {
            expanded = true;
            totalUnits += meta.total - 1;
            if (!quiet) activitySetTotal(totalUnits);
          }
          if (entry.done) {
            if (!count) issue(file.name, new Error('El ZIP no contiene CFDI XML.'));
            break;
          }
          count++;
          await accept(entry.value.name, entry.value.xml);
          doneUnits++;
          if (!quiet) activityProgress(doneUnits, file.name + ' · ' + entry.value.name);
        }
        if (expanded && count < meta.total) {
          

          doneUnits += meta.total - count;
          if (!quiet) activityProgress(doneUnits, file.name);
        }
        if (!expanded) { doneUnits++; if (!quiet) activityProgress(doneUnits, file.name); }
      }
    }
    await flush();
    await writeBatch({ activity: [{
      id: crypto.randomUUID(), name: files.length === 1 ? files[0].name.slice(0, 180) : files.length + ' archivos',
      date: new Date().toISOString(), added, duplicates, review, issues
    }] });
    if (!quiet) {
      

      lastImport = { at: Date.now(), added, duplicates, review, dupIds };
      announce(added + ' nuevos · ' + duplicates + ' duplicados · ' + review + ' por revisar' +
        (scopeRejected ? '\n' + scopeRejected + ' archivo(s) no corresponden al RFC seleccionado (' + requiredRfc + ') y quedaron por revisar: cambia el selector a «Todos los RFC» para importarlos.' : '') +
        (issues.length ? '\n' + issues.slice(0, 6).map(item => item.name + ' · ' + item.reason).join('\n') : ''), Boolean(review));
      if (!review) soundCue('success'); else if (added) soundCue('notice');
      



      const esGrande = totalUnits >= 10 || review > 0 || skipped.length > 0;
      if (esGrande) {
        const lines = [];
        lines.push(added
          ? '✓ ' + number.format(added) + ' comprobantes nuevos (' + number.format(nuevosEmitidos) + ' emitidos · ' + number.format(nuevosRecibidos) + ' recibidos).'
          : 'Sin comprobantes nuevos.');
        if (nuevosPorMes.size) {
          const top = [...nuevosPorMes.entries()].sort((a, b) => b[0].localeCompare(a[0])).slice(0, 4);
          lines.push('Por mes: ' + top.map(([mes, n]) => mes + ': ' + number.format(n)).join(' · ') + (nuevosPorMes.size > 4 ? ' · …' : ''));
        }
        if (duplicates) lines.push(number.format(duplicates) + ' duplicados: ya estaban en PacoSAT y no se tocaron.');
        if (review) {
          lines.push('⚠ ' + number.format(review) + ' por revisar — no entraron. Motivo de los primeros:');
          for (const item of issues.slice(0, 6)) lines.push('· ' + item.name + ' — ' + item.reason);
          if (scopeRejected) lines.push(number.format(scopeRejected) + ' no corresponden al RFC seleccionado (' + requiredRfc + '): cambia el selector a «Todos los RFC» y vuelve a importarlos.');
          lines.push('Qué hacer: corrige el archivo o el RFC indicado y vuelve a importar solo esos; los demás ya están dentro.');
        }
        if (skipped.length) {
          lines.push('Sin procesar (' + skipped.length + '): no son XML ni ZIP de CFDI.');
          for (const item of skipped.slice(0, 6)) lines.push('· ' + item.name + ' — ' + item.reason);
        }
        activityDone('✓ Procesado', lines);
      } else activityFinish();
    }
    return { added, duplicates, review };
  } catch (error) {
    announce(added + ' comprobantes guardados antes de interrumpir el lote. ' + error.message, true);
    if (!quiet) activityFail('La importación se interrumpió', added + ' comprobantes quedaron guardados antes de la interrupción. ' + error.message);
    if (quiet) throw error;
  } finally {
    importing = false;
    $('primary').disabled = !ready;
    try { await refresh(quiet && page === 'sat'); } catch (error) { announce(error.message, true); }
  }
}

async function validateBackup(data) {
  check(data?.version === 2 && STORES.every(key => Array.isArray(data[key])), 'El contenido del respaldo no es compatible.');
  const validText = (value, max) => typeof value === 'string' && value.length <= max;
  const registry = new Map();
  for (const p of data.people) {
    check(RFC.test(p?.id) && validText(p.name, 120) && p.name.trim() && !registry.has(p.id), 'El respaldo contiene un RFC inválido.');
    registry.set(p.id, { id: p.id, name: p.name });
  }
  const contents = new Map();
  for (const item of data.files) {
    check(validText(item?.id, 70) && validText(item.content, 21 * MB) && !contents.has(item.id), 'El respaldo contiene un archivo inválido.');
    contents.set(item.id, item.content);
  }
  const output = { people: [...registry.values()], invoices: [], documents: [], activity: [], files: [] };
  for (const entry of data.invoices) {
    const id = 'xml:' + entry.id;
    check(UUID.test(entry.id) && contents.has(id), 'Falta un XML en el respaldo.');
    const raw = decode64(contents.get(id));
    const row = withFiscal(parseXml(raw), raw);
    check(entry.id === row.id && (registry.has(row.from.rfc) || registry.has(row.to.rfc)), 'El XML del respaldo no coincide.');
    output.invoices.push(row);
    output.files.push({ id, blob: new Blob([raw], { type: 'application/xml' }) });
    contents.delete(id);
  }
  for (const entry of data.documents) {
    check(typeof entry.id === 'string' && /^pdf:[a-f0-9-]{36}$/.test(entry.id) && contents.has(entry.id) &&
      registry.has(entry.rfc) && DOCUMENTS.includes(entry.kind) && /^\d{4}-\d{2}-\d{2}$/.test(entry.date) &&
      validText(entry.period, 40) && validText(entry.name, 180), 'El respaldo contiene un documento inválido.');
    const blob = new Blob([decode64(contents.get(entry.id))], { type: 'application/pdf' });
    check(await pdfOk(blob), 'El respaldo contiene un PDF dañado.');
    const { id, rfc, kind, date, period, name, uuid } = entry;
    check(uuid === undefined || uuid === '' || (typeof uuid === 'string' && UUID.test(uuid)), 'El respaldo contiene un UUID de PDF inválido.');
    output.documents.push({ id, rfc, kind, date, period, name, uuid });
    output.files.push({ id, blob });
    contents.delete(id);
  }
  for (const entry of data.activity) {
    check(validText(entry.id, 70) && validText(entry.name, 180) && validText(entry.date, 40) &&
      ['added', 'duplicates', 'review'].every(key => Number.isSafeInteger(entry[key]) && entry[key] >= 0), 'El historial del respaldo es inválido.');
    const { id, name, date, added, duplicates, review } = entry;
    const issues = Array.isArray(entry.issues) ? entry.issues.slice(0, 20)
      .filter(item => validText(item?.name, 180) && validText(item.reason, 320))
      .map(item => ({ name: item.name, reason: item.reason })) : [];
    const restored = { id, name, date, added, duplicates, review, issues };
    if (validText(entry.event, 320)) restored.event = entry.event;
    output.activity.push(restored);
  }
  check(contents.size === 0, 'El respaldo contiene archivos sin expediente.');
  return output;
}

function zipStore(entries) {
  const encoder = new TextEncoder();
  const parts = [], centrals = [];
  let offset = 0;
  for (const entry of entries) {
    const name = encoder.encode(entry.name);
    const data = entry.data instanceof Uint8Array ? entry.data : encoder.encode(String(entry.data));
    const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
    local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
    local.setUint16(26, name.length, true);
    parts.push(new Uint8Array(local.buffer), name, data);
    const central = new DataView(new ArrayBuffer(46));
    central.setUint32(0, 0x02014b50, true); central.setUint16(4, 20, true); central.setUint16(6, 20, true);
    central.setUint32(16, crc, true); central.setUint32(20, data.length, true); central.setUint32(24, data.length, true);
    central.setUint16(28, name.length, true); central.setUint32(42, offset, true);
    centrals.push(new Uint8Array(central.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, centrals.reduce((sum, part) => sum + part.length, 0), true); end.setUint32(16, offset, true);
  parts.push(...centrals, new Uint8Array(end.buffer));
  return new Blob(parts, { type: 'application/zip' });
}

const STORAGE_WAIT_MS = 10000;
let storageFailure = null;   
let storagePending = false;  
async function openLocalStorage() {
  storagePending = true;
  try { db = await openDatabase(); return true; }
  catch (error) { storageFailure = error; return false; }
  finally { storagePending = false; }
}
function storageAdvice() {
  if (cloudStorage) return 'PacoSAT no pudo cargar los datos del servidor. Revisa la conexión con el servidor, recarga la página y vuelve a intentarlo.';
  if (isStorageBlocked()) return 'Otra pestaña o ventana de PacoSAT tiene el almacenamiento local ocupado. Cierra las demás pestañas de PacoSAT, recarga esta página y vuelve a intentarlo.';
  return 'El navegador no dejó abrir el almacenamiento local de PacoSAT. Cierra las demás pestañas de la app, recarga la página y vuelve a intentarlo; si aun así falla, abre la app en Chrome o Edge con un perfil normal (no privado).';
}
let storageAttempt, readiness;
function beginReadiness() {
  storageAttempt = cloudStorage ? Promise.resolve(true) : openLocalStorage();
  readiness = storageAttempt.then(async opened => {
    if (!opened) return false;
    ready = true;
    await refresh();
    return true;
  });
  return readiness;
}
async function waitReadiness(waitMs) {
  if (ready) return true;
  






  if (!readiness) beginReadiness();
  let timer;
  const timeout = new Promise(resolve => { timer = setTimeout(() => resolve(false), waitMs); });
  const settled = readiness.then(() => ready, () => ready);
  const ok = await Promise.race([settled, timeout]);
  clearTimeout(timer);
  return Boolean(ok && ready);
}
async function retryStorage(waitMs) {
  




  if (!storagePending) beginReadiness();
  return waitReadiness(waitMs);
}
async function requireStorage(waitMs = STORAGE_WAIT_MS) {
  if (ready) return;
  if (await waitReadiness(waitMs)) return;
  if (await retryStorage(waitMs)) return;
  throw new Error(storageAdvice());
}

function requestDialog(preset) {

  const start = input('date', { max: today, value: today.slice(0, 8) + '01', required: true });
  const end = input('date', { max: today, value: today, required: true });

  if (preset) {

  }
  const type = select([['cfdi', 'CFDI (XML completos)'], ['metadata', 'Metadatos (registros ligeros, para reconciliar)']], 'cfdi');
  if (preset?.type) type.value = preset.type;
  
  const quick = n('div', undefined, 'actions');
  const fmt = date => date.toISOString().slice(0, 10);
  const setRange = (from, to) => { start.value = fmt(from); end.value = fmt(to); refreshPlan(); };
  const nowDate = new Date(today + 'T12:00:00');
  quick.append(
    action('Mes pasado', () => setRange(new Date(nowDate.getFullYear(), nowDate.getMonth() - 1, 1), new Date(nowDate.getFullYear(), nowDate.getMonth(), 0))),
    action('Este trimestre', () => setRange(new Date(nowDate.getFullYear(), Math.floor(nowDate.getMonth() / 3) * 3, 1), nowDate)),
    action('Este año', () => setRange(new Date(nowDate.getFullYear(), 0, 1), nowDate)),
    action('Últimos 30 días', () => setRange(new Date(nowDate.getTime() - 29 * 86400000), nowDate)));
  




  const planNote = n('p', 'Revisando el criterio en el libro…', 'plan-note');
  const metaFirst = action('Pedir este rango como Metadatos', () => { type.value = 'metadata'; refreshPlan(); });
  metaFirst.hidden = true;
  const planBox = n('div', undefined, 'plan-box');
  planBox.append(planNote, metaFirst);
  let planSeq = 0;
  async function refreshPlan() {
    const seq = ++planSeq;
    try {
      const plan = await satApi('plan', { rfc: person.value, direction: direction.value, type: type.value, start: start.value, end: end.value });
      if (seq !== planSeq) return;
      planNote.textContent = plan.reason;
      metaFirst.hidden = plan.recommendation !== 'metadata-first';
    } catch {
      if (seq !== planSeq) return;
      planNote.textContent = 'El planificador no pudo revisar el libro; la guardia actuará al enviar, como siempre.';
      metaFirst.hidden = true;
    }
  }
  for (const control of [person, direction, type, start, end]) control.addEventListener('change', refreshPlan);
  refreshPlan();
  dialog('Solicitar un periodo al SAT', [field('Contribuyente', person), field('Comprobantes', direction),
    field('Tipo de solicitud', type), field('Planificador 5002', planBox), field('Periodo frecuente', quick),
    field('Fecha inicial', start), field('Fecha final', end)], async () => {
    const payload = { rfc: person.value, direction: direction.value, start: start.value, end: end.value, type: type.value };
    
    if (preset?.shiftEnd) payload.shiftEnd = 1;
    for (;;) {
      try { satData = await satApi('request', payload); break; }
      catch (error) {
        if (!error.guard) throw error;
        const choice = await guardChoice(error.guard);
        if (choice === 'cancel') {
          $('dialog').close();
          announce('Solicitud no enviada. ' + error.guard.message, true);
          return;
        }
        if (choice === 'rescue') {
          $('dialog').close();
          rescueDialog(error.guard);
          return;
        }
        


        payload.shiftEnd = (payload.shiftEnd || 0) + 1;
      }
    }
    fillSat(); announce('Solicitud enviada. PacoSAT revisará cuándo libera el paquete el SAT.');
  }, 'Enviar solicitud');
}

async function pollSat() {
  if (!satToken || !ready || satPolling) return;
  satPolling = true;
  try {
    satData = await satApi('status');
    satError = '';
    flushOfflineQueue().catch(() => {});
    if (satData.settings) {
      
      appSettings = { ...appSettings, ...satData.settings, logoData: appSettings.logoData };
      if (satData.settings.hasLogo && !appSettings.logoData) {
        try {
          const logo = await satApi('settings/logo');
          appSettings.logoData = 'data:' + logo.mime + ';base64,' + logo.data;
        } catch {  }
      }
      if (!satData.settings.hasLogo) appSettings.logoData = '';
      applySettings();
    }
    if (cloudStorage && satData.cloudRevision !== cloudRevision && !$('dialog').open && !importing &&
        !document.activeElement?.matches('input,select,textarea')) {
      await refresh(page === 'sat');
      cloudRevision = satData.cloudRevision;
    }
    const drain = async () => {
      for (const packet of satData.inbox) {
        if (importing || !people.some(person => person.id === packet.rfc)) continue;
        const archive = await satApi('packages/' + packet.id);
        if (importing || $('dialog').open) break;
        const result = await importBatch([new File([archive], 'SAT-' + packet.rfc + '-' + packet.id + '.zip')], packet.rfc, { quiet: true });
        if (result) { if (result.added) soundCue('notice'); await satApi('packages/' + packet.id, { imported: result.added }); }
      }
    };
    if (!$('dialog').open) {
      if (navigator.locks) await navigator.locks.request('pacosat-sat-import', { ifAvailable: true }, lock => lock ? drain() : undefined);
      else await drain();
    }
  } catch (error) {
    satError = error.message;
  } finally {
    satPolling = false;
    

    refreshAvisos().catch(() => {});
    if (page === 'sat' && !$('dialog').open && !document.activeElement?.closest('#sat-live')) fillSat();
    

    const mailLive = $('sat-mail-live');
    if (mailLive && !$('dialog').open && !document.activeElement?.closest('#sat-mail-live')) fillSatMail(mailLive);
  }
}

function monitorErrorText(error) {

  if (/fetch|network|conexi|red\b/i.test(error)) return 'No hubo conexión con el servicio del SAT. Se volverá a intentar solo; no tienes que hacer nada.';
  return 'Hubo un problema al consultar el SAT. Se volverá a intentar solo; no tienes que hacer nada.';

      'El SAT presume operaciones inexistentes de este RFC: pide aclaración al emisor y avisa a tu contadora antes de deducir.' };
  if (item?.sat?.state === 'Vigente') return { badge: 'Vigente', state: 'Vigente',
    text: 'El SAT lo confirma vigente.' + (item.checked ? ' Revisado el ' + localDateTime(item.checked) + '.' : '') };

  if (item?.sat?.state === 'Formato rechazado') return { badge: 'Formato rechazado', state: 'Formato rechazado',

function donutSegments(counts) {
  const order = [['vigente', 'Vigentes'], ['cancelado', 'Cancelados'], ['efos', 'Con 69-B'], ['sin', 'Sin consulta']];
  const total = order.reduce((sum, [key]) => sum + (counts[key] || 0), 0);
  let acc = 0;
  return order.map(([key, label]) => {
    const value = counts[key] || 0;
    const frac = total ? value / total : 0;
    const segment = { key, label, value, frac, start: acc };
    acc += frac;
    return segment;
  });
}

async function monitorCheckNow() {
  const selection = invoices.filter(matches);
  const pending = selection.filter(row => !fiscalResults.get(row.id)?.sat);
  if (!pending.length) { announce('No hay comprobantes pendientes de revisar: todos tienen ya su estado del SAT.'); return; }
  activityStart('Revisando el estado de tus CFDI en el SAT', pending.length);
  try {
    const fresh = pending.filter(row => !watched.has(row.id)).map(monitorRow);
    for (let i = 0; i < fresh.length; i += 150) {
      const chunk = fresh.slice(i, i + 150);
      await satApi('monitor', { records: chunk, ids: [] });
      for (const row of chunk) watched.add(row.id);
    }
    let done = 0, guard = 0;
    for (;;) {
      const result = await satApi('monitor/check-now', { ids: pending.map(row => row.id) });
      done += result.processed || 0;
      activityProgress(Math.min(done, pending.length),
        result.remaining ? 'Quedan ' + number.format(result.remaining) + ' en la cola de revisión.' : '');
      if (!result.remaining || !result.processed) break;
      if (++guard > 400) break;
      if (result.busy) await new Promise(resolve => setTimeout(resolve, 1500));
    }
    await pollMonitor();
    await loadMonitorSummary(true);
    const counts = monitorSummary?.counts;
    activityDone('✓ Revisión terminada', [
      'Ya tienen estado del SAT ' + number.format(counts?.revisados || 0) + ' de ' + number.format(counts?.total || selection.length) + ' comprobantes.',
      (counts?.sinRevisar || counts?.conProblema) ?

        'No queda ningún comprobante sin revisar.'

    activityFail('La revisión se detuvo', 'Pasó esto: ' + error.message + ' Lo ya revisado quedó guardado; puedes repetir el botón cuando quieras.');

}

async function pollMonitor() {
  if (!satToken || !ready || monitoring) return;
  monitoring = true;
  try {
    const records = invoices.filter(row => !watched.has(row.id)).slice(0, 125).map(monitorRow);
    const all = invoices.filter(matches);
    if (monitorCursor >= all.length) monitorCursor = 0;
    const candidates = page === 'invoices' ? invoiceRows().slice(invoicePage * 35, (invoicePage + 1) * 35) : all.slice(monitorCursor, monitorCursor + 500);
    const result = await satApi('monitor', { records, ids: candidates.map(row => row.id) });
    for (const row of records) watched.add(row.id);
    for (const entry of result.results) fiscalResults.set(entry.id, entry);
    let cancellationsLogged = 0;
    for (const entry of result.results) {
      if (cancellationsLogged >= 5 || entry.sat?.state !== 'Cancelado') continue;
      const text = 'Cancelación detectada · ' + entry.id;
      if (activity.some(row => row.event === text)) continue;
      await logEvent(text);
      soundCue('alert');
      cancellationsLogged++;
    }
    if (page !== 'invoices') monitorCursor += 500;
    monitorData = result;
    monitorError = '';
    

    const sig = result.results.map(entry => entry.id + ':' + (entry.sat?.state || '') + ':' + (entry.efos?.length ? '69' : '')).join('|');
    monitorChanged = sig !== monitorSig;
    monitorSig = sig;
    if (page === 'monitor') await loadMonitorSummary();
  } catch (error) { monitorError = error.message; }
  finally {
    monitoring = false;
    if (page === 'monitor' && !$('dialog').open && !document.activeElement?.matches('input,select,textarea')) render();
    if (page === 'invoices' && monitorChanged && !$('dialog').open && !document.activeElement?.closest('button,input,select,textarea')) render();
  }
}

function coverageHeatmap(rfc, daysForRfc) {
  const wrap = panel('Mapa anual de días cubiertos · ' + rfc);
  const received = new Set(daysForRfc.received || []), issued = new Set(daysForRfc.issued || []);
  const years = [...new Set([...received, ...issued].map(date => date.slice(0, 4)))].sort();
  const year = years.includes(coverageYear) ? coverageYear : (years.length ? years[years.length - 1] : String(new Date().getFullYear()));
  if (years.length > 1) {
    const picker = n('div', undefined, 'actions');
    const select = n('select');
    for (const option of years) { const node = n('option', option); node.value = option; select.append(node); }
    select.value = year;
    select.onchange = () => { coverageYear = select.value; render(); };
    picker.append(n('label', 'Año'), select);
    wrap.append(picker);
  }
  if (!received.size && !issued.size) {
    wrap.append(empty('Sin días cubiertos', 'Cuando una solicitud de este RFC termine, sus días se pintan aquí.'));
    return wrap;
  }
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const el = (tag, attrs, text) => {
    const node = document.createElementNS(NS, tag);
    for (const [name, value] of Object.entries(attrs || {})) node.setAttribute(name, value);
    if (text) node.textContent = text;
    return node;
  };
  const cell = 11, pitch = 14, top = 16;
  const jan1 = Date.UTC(Number(year), 0, 1);
  const firstSunday = jan1 - new Date(jan1).getUTCDay() * 86400000;
  const weeks = Math.ceil(((Date.UTC(Number(year), 11, 31) - firstSunday) / 86400000 + 1) / 7);
  svg.setAttribute('viewBox', '0 0 ' + (weeks * pitch + 2) + ' ' + (top + 7 * pitch));
  svg.setAttribute('class', 'hm'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Mapa de calor de días con descarga cubierta en ' + year + ' para ' + rfc);
  svg.append(el('title', {}, 'Días cubiertos en ' + year + ' · ' + rfc));
  const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  for (let month = 0; month < 12; month++) {
    const first = Date.UTC(Number(year), month, 1);
    const week = Math.floor((first - firstSunday) / (7 * 86400000));
    svg.append(el('text', { x: week * pitch + 1, y: 10 }, months[month]));
  }
  const detail = n('p', 'Toca un día del mapa para ver su detalle aquí.', 'hm-detail');
  for (let offset = 0; offset < 371; offset++) {
    const date = new Date(firstSunday + offset * 86400000);
    if (date.getUTCFullYear() !== Number(year)) continue;
    const key = date.toISOString().slice(0, 10);
    const level = (received.has(key) ? 1 : 0) + (issued.has(key) ? 1 : 0);
    const rect = el('rect', { x: Math.floor(offset / 7) * pitch + 1, y: top + (offset % 7) * pitch + 1,
      width: cell, height: cell, rx: 2, class: 'hm-l' + level });
    rect.append(el('title', {}, key + ' · recibidos: ' + (received.has(key) ? 'cubierto' : 'sin cubrir') +
      ' · emitidos: ' + (issued.has(key) ? 'cubierto' : 'sin cubrir')));
    

    rect.style.cursor = 'pointer';
    rect.addEventListener('click', () => {
      detail.textContent = dateLabel(key) + ' · recibidos: ' + (received.has(key) ? 'cubierto' : 'sin cubrir') +
        ' · emitidos: ' + (issued.has(key) ? 'cubierto' : 'sin cubrir');
    });
    svg.append(rect);
  }
  const scroll = n('div', undefined, 'hm-scroll'); scroll.append(svg);
  const legend = n('div', undefined, 'chart-legend');
  const item = (cls, label) => { const span = n('span'); span.append(n('i', undefined, cls), document.createTextNode(label)); return span; };
  legend.append(item('sw-hm0', 'Sin cubrir'), item('sw-hm1', 'Un sentido'), item('sw-hm2', 'Recibidos y emitidos'));
  wrap.append(scroll, legend, detail);
  return wrap;
}

async function saveAppSettings() {

    if (pendingLogo === '') {

function splitCsvText(text) {
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',' || ch === ';') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
async function parseSpreadsheetRows(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  let grid;
  if (/\.xlsx$/i.test(file.name)) {
    let shared = [], sheet = '';
    for await (const entry of zipEntries(bytes, /\.xml$/)) {
      if (/sharedStrings\.xml$/.test(entry.name)) {
        const doc = new DOMParser().parseFromString(decodeXml(entry.content), 'text/xml');
        shared = [...doc.querySelectorAll('si')].map(si => [...si.querySelectorAll('t')].map(t => t.textContent).join(''));
      }
      if (/worksheets\/sheet1\.xml$/.test(entry.name)) sheet = decodeXml(entry.content);
    }
    if (!sheet) throw new Error('No se encontró la primera hoja del libro.');
    const doc = new DOMParser().parseFromString(sheet, 'text/xml');
    grid = [...doc.querySelectorAll('row')].map(row => [...row.querySelectorAll('c')].map(cell => {
      const value = cell.querySelector('v')?.textContent || cell.querySelector('is t')?.textContent || '';
      return cell.getAttribute('t') === 's' ? (shared[Number(value)] || '') : value;
    }));
  } else {
    grid = splitCsvText(new TextDecoder('utf-8').decode(bytes).replace(/^﻿/, ''));
  }
  if (!grid.length) throw new Error('La hoja está vacía.');
  const header = grid[0].map(cell => String(cell).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase());
  const hasHeader = header.some(cell => /nombre|rfc|nota|tipo/.test(cell));
  const col = (names, fallback) => { const i = header.findIndex(cell => names.includes(cell)); return hasHeader && i >= 0 ? i : fallback; };
  const ci = { name: col(['nombre', 'nombre o razon social', 'razon social'], 0), rfc: col(['rfc'], 1),
    note: col(['nota', 'notas'], 2), kind: col(['tipo'], 3) };
  return grid.slice(hasHeader ? 1 : 0).map(row => ({
    name: String(row[ci.name] || ''), rfc: String(row[ci.rfc] || ''),
    note: String(row[ci.note] || ''), kind: String(row[ci.kind] || '') }))
    .filter(row => row.rfc.trim());
}
function bytesToBase64(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(out);
}

function periodCsv(month) {
  const escape = value => '"' + String(value ?? '').replaceAll('"', '""') + '"';
  const rows = [['UUID', 'Fecha', 'Tipo', 'Emisor RFC', 'Emisor', 'Receptor RFC', 'Receptor', 'Subtotal', 'IVA', 'Total', 'Moneda', 'Método de pago']];
  for (const row of outMonthInvoices(month)) {
    const iva = invoiceIvaCents(row);
    rows.push([row.id, row.date, row.kind, row.from.rfc, row.from.name, row.to.rfc, row.to.name,
      row.fiscal?.subtotal || '', iva === null ? '' : centsPlain(iva), centsPlain(totalCents(row)), row.currency || 'MXN', row.fiscal?.paymentMethod || '']);
  }
  return rows.map(row => row.map(escape).join(',')).join('\r\n');
}

function yoyPanel() {

  const year = new Date().getFullYear();
  const totals = new Map();
  for (const row of invoices) {
    if ((row.currency && row.currency !== 'MXN') || row.kind !== 'I') continue;
    const y = row.date.slice(0, 4);
    if (y !== String(year) && y !== String(year - 1)) continue;
    for (const [rfc, name, field] of [[row.from.rfc, row.from.name, 'received'], [row.to.rfc, row.to.name, 'issued']]) {
      if (scope && rfc === scope) continue;
      const key = rfc;
      if (!totals.has(key)) totals.set(key, { name: name || rfc, rfc, receivedNow: 0n, receivedPrev: 0n, issuedNow: 0n, issuedPrev: 0n });
      const item = totals.get(key);
      item[field + (y === String(year) ? 'Now' : 'Prev')] += totalCents(row);
    }
  }
  const rows = [...totals.values()].map(item => ({ ...item,
    delta: (item.receivedNow - item.receivedPrev) + (item.issuedNow - item.issuedPrev) }))
    .filter(item => item.receivedNow || item.receivedPrev || item.issuedNow || item.issuedPrev)
    .sort((a, b) => (b.delta < a.delta ? -1 : b.delta > a.delta ? 1 : 0)).slice(0, 15);
  if (!rows.length) { panelEl.append(n('p', 'Aún no hay dos años de datos para comparar.', 'empty')); return panelEl; }
  panelEl.append(grid(['Contraparte', 'Recibido ' + (year - 1), 'Recibido ' + year, 'Emitido ' + (year - 1), 'Emitido ' + year, 'Cambio'],
    rows.map(item => [cell(item.name, item.rfc), '$' + centsLabel(item.receivedPrev), '$' + centsLabel(item.receivedNow),
      '$' + centsLabel(item.issuedPrev), '$' + centsLabel(item.issuedNow),
      (item.delta >= 0n ? '+$' : '−$') + centsLabel(item.delta < 0n ? -item.delta : item.delta)])));
  return panelEl;
}

function reconcileMovements(movements, paidBy) {
  const results = movements.map(movement => ({ movement, match: null }));
  const usedInvoices = new Set();
  for (const result of results) {
    const amount = movementAmountCents(result.movement);
    if (!amount) continue;
    const candidates = invoices.filter(row => row.kind === 'I' && !usedInvoices.has(row.id) &&
      Math.abs(Number(totalCents(row)) - Math.abs(amount)) === 0 &&
      Math.abs(Date.parse(row.date) - Date.parse(result.movement.date)) <= 45 * 86400000);
    if (candidates.length === 1) { result.match = candidates[0]; usedInvoices.add(candidates[0].id); }
  }
  return results;
}
function movementAmountCents(movement) {
  if (movement.amountCents !== undefined) return movement.amountCents;
  const charge = moneyCents(movement.charge || ''), credit = moneyCents(movement.credit || '');
  return charge ? -Number(charge) : Number(credit);
}

    row.append(statusPill(result.match ? 'ok' : 'warn', result.match ? 'Con factura' : 'Sin factura'),

function reconcilePanel(paidBy) {

      check(ci.date >= 0 && (ci.charge >= 0 || ci.credit >= 0), 'No se reconocen las columnas: hace falta fecha y cargo o abono.');
      const movements = rows.slice(1).map(row => ({ date: row[ci.date], concept: ci.concept >= 0 ? row[ci.concept] : '',
        charge: ci.charge >= 0 ? row[ci.charge] : '', credit: ci.credit >= 0 ? row[ci.credit] : '' }))
        .filter(movement => /^\d{4}-\d{2}-\d{2}/.test(movement.date || ''));
      renderReconcile(out, movements, paidBy);

const pagosPad2 = value => String(value).padStart(2, '0');
function pagosIsoFecha(fecha) {

}
function pagosParseFecha(iso) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
}
function pagosFechaLarga(iso) {
  const fecha = pagosParseFecha(iso);
  if (!fecha) return '—';
  const partes = {};
  for (const parte of new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).formatToParts(fecha))
    partes[parte.type] = parte.value;
  return partes.weekday + ' ' + partes.day + ' de ' + partes.month + ' de ' + partes.year;
}
function pagosMesLargo(mes) {

  if (!match) return '';
  return new Intl.DateTimeFormat('es-MX', { month: 'long', year: 'numeric' }).format(new Date(Number(match[1]), Number(match[2]) - 1, 1));
}
function pagosDefaults(mes) {
  const match = /^(\d{4})-(\d{2})$/.exec(String(mes || ''));
  const hoy = new Date();
  const anio = match ? Number(match[1]) : hoy.getFullYear();
  const numMes = match ? Number(match[2]) : hoy.getMonth() + 1;
  const diaDiez = new Date(anio, numMes - 1, 10);
  const hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const cargo = diaDiez < hoySinHora ? hoySinHora : diaDiez;
  const siguiente = new Date(cargo.getFullYear(), cargo.getMonth(), cargo.getDate() + 1);
  return {
    referencia: pagosPad2(numMes) + String(anio),
    fechaCargo: pagosIsoFecha(cargo),

function fiscalLocalEvents() {
  const events = [];
  const today = new Date();
  const monthKey = today.toISOString().slice(0, 7);
  for (const person of people) {
    const due17 = today.getDate() <= 17 ? monthKey + '-17' :
      new Date(today.getFullYear(), today.getMonth() + 1, 17).toISOString().slice(0, 10);
    events.push({ rfc: person.id, kind: 'mensual', title: 'Pago provisional y DIOT (día 17)', date: due17 });
    const annualYear = today.getMonth() < 3 || (today.getMonth() === 2 && today.getDate() <= 31) ? today.getFullYear() : today.getFullYear() + 1;
    events.push({ rfc: person.id, kind: 'anual', title: 'Declaración anual (31 de marzo)', date: annualYear + '-03-31' });
  }
  for (const item of JSON.parse(localStorage.getItem('pacosat-fiscal-events') || '[]'))
    events.push({ rfc: item.rfc || '', kind: 'manual', title: item.title, date: item.date, id: item.id });
  for (const event of events) event.daysLeft = Math.round((Date.parse(event.date + 'T12:00:00') - Date.now()) / 86400000);
  return events.sort((a, b) => a.date.localeCompare(b.date));
}
function fiscalLocalIssues() {
  const issues = [];
  const own = new Set(people.map(person => person.id));
  const byFolio = new Map();
  for (const row of invoices) {
    if (row.fiscal?.serie || row.fiscal?.folio) {
      const key = row.from.rfc + '|' + (row.fiscal.serie || '') + '|' + (row.fiscal.folio || '');
      



      const diaEmision = String(row.date || '').slice(0, 10);
      const total = totalCents(row);
      const group = byFolio.get(key) || [];
      const clash = group.find(other => other.id !== row.id &&
        ((diaEmision && other.dia === diaEmision) || (total > 0n && other.total === total)));
      if (clash)
        issues.push({ id: row.id, kind: 'folio-duplicado', detail: 'Mismo emisor, serie y folio que otro CFDI con distinto UUID, y además coincide ' +
          (diaEmision && clash.dia === diaEmision ? 'la fecha de emisión' : 'el importe total') + ': patrón de reemisión con el mismo folio.' });
      group.push({ id: row.id, dia: diaEmision, total });
      byFolio.set(key, group);
    }
    if (row.kind === 'I' && row.to?.rfc && !own.has(row.to.rfc) && !own.has(row.from.rfc))
      issues.push({ id: row.id, kind: 'receptor-ajeno', detail: 'Ni el emisor ni el receptor son perfiles de PacoSAT.' });
    const fiscal = row.fiscal;
    if (fiscal?.subtotal) {
      const expected = moneyCents(fiscal.subtotal) - moneyCents(fiscal.discount) + moneyCents(fiscal.totalTransferred) - moneyCents(fiscal.totalWithheld);
      if (Math.abs(Number(expected - totalCents(row))) > 5)
        issues.push({ id: row.id, kind: 'totales-no-cuadran', detail: 'El desglose suma $' + centsLabel(expected) + ' y el total dice $' + centsLabel(totalCents(row)) + '.' });
    }
  }
  return issues.slice(0, 200);
}
function anomalyRows() {
  

  const anomalies = [];
  const byEmitter = new Map();
  for (const row of invoices) {
    if (row.kind !== 'I') continue;
    if (!byEmitter.has(row.from.rfc)) byEmitter.set(row.from.rfc, []);
    byEmitter.get(row.from.rfc).push(row);
  }
  for (const [rfc, rows] of byEmitter) {
    if (rows.length >= 4) {
      const totals = rows.map(row => Number(totalCents(row))).sort((a, b) => a - b);
      const median = totals[Math.floor(totals.length / 2)];
      for (const row of rows)
        if (median > 0 && Number(totalCents(row)) > median * 3 && Number(totalCents(row)) - median > 100000)
          anomalies.push({ id: row.id, kind: 'importe-inusual', detail: (row.from.name || rfc) + ': $' + centsLabel(totalCents(row)) + ' frente a su mediana de $' + centsLabel(BigInt(Math.round(median))) + '.' });
    }
    const sorted = [...rows].sort((a, b) => a.date.localeCompare(b.date));
    for (let i = 1; i < sorted.length; i++) {
      const prev = sorted[i - 1], current = sorted[i];
      if (totalCents(prev) === totalCents(current) && prev.id !== current.id &&
          Math.abs(Date.parse(current.date) - Date.parse(prev.date)) <= 3 * 86400000)
        anomalies.push({ id: current.id, kind: 'duplicado-aproximado', detail: 'Mismo emisor e importe que ' + prev.id.slice(0, 13) + '… a menos de 3 días. ¿Duplicado?' });
    }
  }
  return anomalies.slice(0, 100);
}

function offlineDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('pacosat-offline', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('kv');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function kvGet(key) {
  const db = await offlineDb();
  return new Promise((resolve, reject) => {
    const request = db.transaction('kv').objectStore('kv').get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function kvSet(key, value) {
  const db = await offlineDb();
  return new Promise((resolve, reject) => {
    const request = db.transaction('kv', 'readwrite').objectStore('kv').put(value, key);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}
async function offlineKey() {
  let jwk = await kvGet('key');
  if (!jwk) {
    const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    jwk = await crypto.subtle.exportKey('jwk', key);
    await kvSet('key', jwk);
  }
  return crypto.subtle.importKey('jwk', jwk, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}
let offlineBundleCache = null;
async function syncOfflineBundle() {
  check(satToken, 'El paquete sin conexión se prepara desde el servidor.');
  const bundle = await satApi('offline-bundle');
  const key = await offlineKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(bundle)));
  await kvSet('bundle', { iv: encode64(iv), data: encode64(new Uint8Array(cipher)), at: bundle.generatedAt });
  offlineBundleCache = bundle;
  return bundle;
}
async function loadOfflineBundle() {
  if (offlineBundleCache) return offlineBundleCache;
  const stored = await kvGet('bundle');
  if (!stored) return null;
  const key = await offlineKey();
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode64(stored.iv) }, key, decode64(stored.data));
  offlineBundleCache = JSON.parse(new TextDecoder().decode(plain));
  return offlineBundleCache;
}



async function enqueueOfflineAction(actionItem) {
  const queue = (await kvGet('queue')) || [];
  if (!queue.some(item => item.type === actionItem.type && item.rfc === actionItem.rfc)) queue.push(actionItem);
  await kvSet('queue', queue);
}
async function requestRunNow(rfc) {
  if (!navigator.onLine) {
    await enqueueOfflineAction({ type: 'run-now', rfc, at: Date.now() });
    announce('Sin conexión: la descarga de ' + rfc + ' queda EN COLA y se pedirá al volver internet. Registrada como intención; no se enviará dos veces.');
    soundCue('notice');
    return null;
  }
  return satApi('run-now', { rfc });
}
async function flushOfflineQueue() {
  if (!navigator.onLine || !satToken) return;
  const queue = (await kvGet('queue')) || [];
  if (!queue.length) return;
  const remaining = [];
  for (const item of queue) {
    try { if (item.type === 'run-now') await satApi('run-now', { rfc: item.rfc }); }
    catch { remaining.push(item); }
  }
  await kvSet('queue', remaining);
  if (remaining.length < queue.length) { logEvent('Cola sin conexión ejecutada al recuperar la red.'); announce('La cola sin conexión se ejecutó al volver la conexión.'); }
}

}

const MONTH_NAMES = { enero: '01', febrero: '02', marzo: '03', abril: '04', mayo: '05', junio: '06', julio: '07', agosto: '08', septiembre: '09', octubre: '10', noviembre: '11', diciembre: '12' };
function questionPeriod(text) {
  const nowDate = new Date();
  if (/mes pasado/.test(text)) { const date = new Date(nowDate.getFullYear(), nowDate.getMonth() - 1, 1); return date.toISOString().slice(0, 7); }
  if (/este mes/.test(text)) return nowDate.toISOString().slice(0, 7);
  for (const [name, number] of Object.entries(MONTH_NAMES))
    if (text.includes(name)) return nowDate.getFullYear() + '-' + number;
  const match = text.match(/(20\d{2})-(\d{2})/);
  return match ? match[0] : null;
}
function answerQuestion(raw) {
  const text = raw.toLocaleLowerCase('es-MX');
  const period = questionPeriod(text);
  const sumWhere = predicate => invoices.filter(predicate).reduce((acc, row) => acc + Number(totalCents(row)), 0) / 100;
  if (/cu[aá]nto debo/.test(text)) {
    const paidBy = paidByMap();
    let total = 0n;
    for (const row of invoices) {
      if (row.kind !== 'I' || !people.some(person => person.id === row.to.rfc)) continue;
      const balance = balanceOf(row, paidBy).balance;
      if (balance > 0n) total += balance;
    }
    return 'Por PAGAR tienes abiertos $' + centsLabel(total) + '. El detalle con antigüedad está en la pantalla Dinero.';
  }
  if (/cu[aá]nto me deben/.test(text)) {
    const paidBy = paidByMap();
    let total = 0n;
    for (const row of invoices) {
      if (row.kind !== 'I' || !people.some(person => person.id === row.from.rfc)) continue;
      const balance = balanceOf(row, paidBy).balance;
      if (balance > 0n) total += balance;
    }
    return 'Por COBRAR tienes abiertos $' + centsLabel(total) + '. El detalle con antigüedad está en la pantalla Dinero.';
  }
  if (/iva/.test(text) && period) {
    let payable = 0n, creditable = 0n;
    for (const row of invoices) {
      if (!row.date.startsWith(period) || !row.fiscal) continue;
      const issued = people.some(p => p.id === row.from.rfc);
      for (const tax of row.fiscal.transferred || []) if (tax.tax === '002') {
        if (issued) payable += moneyCents(tax.amount); else creditable += moneyCents(tax.amount);
      }
    }
    return 'IVA estimado de ' + period + ' (desde el desglose guardado): trasladado $' + centsLabel(payable) + ', acreditable $' + centsLabel(creditable) + ', a cargo $' + centsLabel(payable - creditable) + '. Es una estimación: la cifra oficial la cierra tu contadora.';
  }
  if (/qu[eé] vence|vencimientos/.test(text)) {
    const events = fiscalLocalEvents().filter(event => event.daysLeft <= 7);
    if (!events.length) return 'En los próximos 7 días no vence nada del calendario fiscal que conozco. El calendario completo está en Cumplimiento.';
    return 'Vence pronto: ' + events.map(event => event.title + ' (' + event.date + ', ' + (event.rfc || 'general') + ')').join(' · ') + '.';
  }
  if (/(factur|gast|compr|vend)/.test(text)) {
    const party = findPartyInQuestion(text);
    const base = invoices.filter(row => row.kind === 'I' && (!period || row.date.startsWith(period)) &&
      (!party || row.from.rfc === party || row.to.rfc === party));
    if (party || period) {
      const total = base.reduce((acc, row) => acc + Number(totalCents(row)), 0) / 100;
      return 'Hay ' + base.length + ' CFDI' + (period ? ' de ' + period : '') + (party ? ' relacionados con ' + party : '') +
        ' por un total de $' + total.toLocaleString('es-MX', { minimumFractionDigits: 2 }) + '.';
    }
  }
  return 'Puedo responder con tus datos locales, sin salir de aquí: «¿cuánto me deben?», «¿cuánto debo?», «¿cuánto IVA tengo en octubre?», «¿qué vence esta semana?» o «¿cuánto facturó [RFC] este mes?».';
}
function findPartyInQuestion(text) {
  const upper = text.toUpperCase();
  const known = new Set();
  for (const row of invoices) { known.add(row.from.rfc); known.add(row.to.rfc); }
  for (const person of people) known.add(person.id);
  for (const rfc of known) if (upper.includes(rfc)) return rfc;
  return null;
}

async function splitBackupDialog() {
  await requireStorage();
  check(!importing && crypto.subtle, 'El respaldo no está disponible en este navegador o hay una importación activa.');
  const password = input('password', { required: true, minLength: 12, autocomplete: 'new-password' });
  const repeat = input('password', { required: true, minLength: 12, autocomplete: 'new-password' });
  dialog('Respaldo partido por RFC y año', [n('p', 'Se genera un archivo .faro por cada RFC y año con facturas: más cómodo para archivar por ejercicios. Cada parte se restaura por separado con la misma contraseña. Sin la contraseña ningún archivo se puede abrir.', 'news-note'),
    field('Contraseña de al menos 12 caracteres', password), field('Confirma la contraseña', repeat)], async () => {
    check(password.value.length >= 12 && password.value === repeat.value, 'Revisa que las contraseñas coincidan.');
    const full = await snapshot();
    const combos = new Map();
    for (const row of full.invoices) {
      for (const rfc of new Set([row.from?.rfc, row.to?.rfc])) {
        if (!rfc) continue;
        const key = rfc + '|' + String(row.date || '').slice(0, 4);
        if (!combos.has(key)) combos.set(key, []);
        combos.get(key).push(row);
      }
    }
    check(combos.size, 'No hay facturas para partir el respaldo.');
    let made = 0;
    for (const [key, rows] of combos) {
      const [rfc, year] = key.split('|');
      const ids = new Set(rows.map(row => row.id));
      const docs = full.documents.filter(doc => doc.rfc === rfc);
      const docIds = new Set(docs.map(doc => doc.id));
      const part = { version: 2,
        people: full.people.filter(person => person.id === rfc),
        invoices: rows,
        documents: docs,
        files: full.files.filter(file => docIds.has(file.id) ||
          (file.id.startsWith('xml:') && ids.has(file.id.slice(4))) ||
          (file.id.startsWith('pdf:') && ids.has(file.id.slice(4)))),
        activity: [] };
      download(await encryptBackup(part, password.value), 'PacoSAT-' + rfc + '-' + year + '.faro');
      made++;
    }
    await logEvent('Respaldo partido creado (' + made + ' archivos por RFC y año)');
    announce(made + ' archivos de respaldo generados, uno por RFC y año.');
    soundCue('success');
  }, 'Crear respaldo partido');
}

      const deClase = data.avisos.filter(aviso => aviso.clase === clase && visiblesPorRfc(aviso));
      if (!deClase.length) continue;
      algunaSeccion = true;
      const section = panel(etiqueta + ' (' + number.format(deClase.length) + ')');
      for (const aviso of deClase) section.append(avisoCard(aviso));
      wrap.append(section);
    }
    if (!algunaSeccion && avisosRfcFiltro) {
      const sinFiltro = panel('Tus avisos');
      sinFiltro.append(n('p', 'Con este filtro no hay avisos de ese RFC. Quita el filtro para verlos todos.', 'muted'));
      wrap.append(sinFiltro);
    }
  }
  if (data.historial.length) {
    const history = panel('Historial · ya solventado', 'Lo que se corrigió queda registrado aquí, con su nota.');
    for (const aviso of data.historial) {
      const row = n('div', undefined, 'cp-row');
      row.append(statusPill('ok', '✓ ' + avisoFecha(aviso.resuelto)),
        n('span', aviso.titulo + (aviso.resolucion ? ' — ' + aviso.resolucion : '')));
      history.append(row);
    }
    wrap.append(history);
  }
  return [wrap];
}








function avisosMailSection(config) {
  const cfg = config || avisosCache?.config || { correo: 'diario', hora: 9 };
  const el = panel('Correo-resumen');
  const intro = n('div', undefined, 'portal');
  const estadoRow = n('div', undefined, 'traffic-strip');
  estadoRow.append(statusPill(cfg.correo === 'no' ? 'dim' : 'ok', cfg.correo === 'no' ? 'Desactivado' : 'Activado'));
  intro.append(estadoRow,
    n('p', 'Los avisos no llegan de uno en uno: como mucho, un solo correo con el resumen. El detalle completo vive en Avisos.'));
  el.append(intro);
  const form = n('div', undefined, 'sat-form');
  const correo = n('select');
  correo.setAttribute('aria-label', 'Cada cuánto quieres el resumen por correo');
  for (const [value, label] of [['diario', 'Un resumen cada día'], ['semanal', 'Un resumen cada lunes'], ['graves', 'Solo cuando haya algo importante'], ['no', 'Sin correo (solo el panel)']]) {
    const option = n('option', label); option.value = value;
    if (cfg.correo === value) option.selected = true;
    correo.append(option);
  }
  const hora = input('number', { min: '0', max: '23', value: String(cfg.hora ?? 9) });
  const save = n('button', 'Guardar', 'soft');
  save.onclick = async () => {
    try {
      const saved = await satApi('notices/config', { correo: correo.value, hora: Number(hora.value) });
      if (avisosCache) avisosCache.config = saved;
      toast('Preferencia del correo-resumen guardada.', 'ok');
    } catch (error) { toast(error.message, 'error'); }
  };
  form.append(fieldWrap('¿Cada cuánto quieres el resumen?', correo), fieldWrap('Hora de envío', hora), save);
  el.append(form);
  return el;
}


function avisosConfigPanel(config) { return avisosMailSection(config); }



function avisosBatchBar() {
  const bar = n('div', undefined, 'traffic-strip');
  const selLabel = n('label', ' Seleccionar visibles');
  const selAll = input('checkbox', { 'aria-label': 'Seleccionar los avisos visibles' });
  selAll.id = 'avisos-batch-all';
  selAll.checked = avisosVisibles.length > 0 && avisosVisibles.every(id => avisosSeleccion.has(id));
  selAll.onchange = () => {
    if (selAll.checked) for (const id of avisosVisibles) avisosSeleccion.add(id);
    else for (const id of avisosVisibles) avisosSeleccion.delete(id);
    paintAvisosBatch();
  };
  selLabel.prepend(selAll);
  const count = n('span', '', 'muted');
  count.id = 'avisos-batch-count';
  const paid = n('button', 'Marcar pagadas', 'primary small');
  paid.id = 'avisos-batch-paid';
  paid.onclick = () => avisoBatch('pagadas');
  const close = n('button', 'Cerrar', 'soft small');
  close.id = 'avisos-batch-close';
  close.onclick = () => avisoBatch('cerrar');
  const discard = n('button', 'Borrar', 'danger-soft small');
  discard.id = 'avisos-batch-discard';
  discard.onclick = () => avisoBatch('borrar');
  bar.append(selLabel, count, paid, close, discard);
  setTimeout(paintAvisosBatch, 0);
  return bar;
}
function paintAvisosBatch() {
  const count = $('avisos-batch-count');
  if (!count) return;
  const elegidos = avisosSeleccion.size;
  count.textContent = elegidos ? number.format(elegidos) + ' seleccionado' + (elegidos === 1 ? '' : 's') : 'Ninguno seleccionado';
  for (const id of ['avisos-batch-paid', 'avisos-batch-close', 'avisos-batch-discard']) {
    const btn = $(id);
    if (btn) btn.disabled = !elegidos;
  }
  const all = $('avisos-batch-all');
  if (all) all.checked = avisosVisibles.length > 0 && avisosVisibles.every(id => avisosSeleccion.has(id));
  document.querySelectorAll('.aviso-check').forEach(el => { el.checked = avisosSeleccion.has(Number(el.dataset.avisoId)); });
}
function avisoBatch(accion) {
  const ids = [...avisosSeleccion];
  if (!ids.length) return;
  const textos = {
    pagadas: ['Marcar pagadas', '¿Marcar pagadas ' + number.format(ids.length) + ' avisos? Solo se aplica a los avisos de saldo; los demás se saltan y al terminar te digo cuántos fueron.', 'Marcar pagadas'],
    cerrar: ['Cerrar avisos', '¿Cerrar ' + number.format(ids.length) + ' avisos? Quedan en el historial como cerrados por ti, sin re-comprobación.', 'Cerrar avisos'],
    borrar: ['Borrar avisos', '¿Borrar ' + number.format(ids.length) + ' avisos? Dejan de aparecer y no vuelven a salir; el descarte queda registrado en la bitácora.', 'Borrar avisos']
  };
  const [titulo, texto, boton] = textos[accion];
  dialog(titulo, [n('p', texto)], async () => {
    try {
      const result = await satApi('notices/batch', { ids, accion });
      avisosSeleccion.clear();
      avisosCache = result;
      avisosFetchedAt = Date.now();
      paintAvisosBadge(result.counts.total);
      toast('Lote terminado: ' + number.format(result.aplicados) + ' aplicados, ' + number.format(result.saltados) + ' saltados.', 'ok');
      soundCue('success');
      render();
    } catch (error) { toast(error.message, 'error'); }
  }, boton);
}
function avisoCard(aviso) {
  const card = n('div', undefined, 'aviso-card');
  const head = n('div', undefined, 'aviso-head');
  const check = input('checkbox', { 'aria-label': 'Seleccionar este aviso' });
  check.classList.add('aviso-check');
  check.dataset.avisoId = String(aviso.id);
  check.checked = avisosSeleccion.has(aviso.id);
  check.onchange = () => {
    if (check.checked) avisosSeleccion.add(aviso.id); else avisosSeleccion.delete(aviso.id);
    paintAvisosBatch();
  };
  head.append(check, avisoPill(aviso), n('strong', aviso.titulo));
  card.append(head);
  if (aviso.detalle) card.append(n('p', aviso.detalle));
  card.append(n('p', avisoMeta(aviso), 'muted'));
  

  if (aviso.accion) card.append(n('p', 'Siguiente paso: ' + aviso.accion, 'aviso-next'));
  


  const mainRow = n('div', undefined, 'traffic-strip');
  mainRow.style.justifyContent = 'flex-end';
  

  const gestiones = n('div', undefined, 'traffic-strip');
  gestiones.append(n('span', 'Lo lleva: ' + avisoResponsableLabel(aviso), 'muted'));
  const cambiarResp = n('button', 'Cambiar', 'soft small');
  cambiarResp.onclick = () => avisoCambiarResponsable(aviso);
  gestiones.append(cambiarResp);
  if (aviso.kind === 'saldo') {
    const paid = n('button', 'Ya se pagó', 'primary');
    paid.onclick = () => avisoMarkPaid(aviso);
    mainRow.append(paid);
    if (aviso.estado === 'por-confirmar') {
      const no = n('button', 'Aún no', 'soft small');
      no.onclick = () => avisoConfirmNo(aviso);
      gestiones.append(no);
    } else {
      const fixed = n('button', 'Ya lo corregí', 'soft small');
      fixed.onclick = () => avisoResolve(aviso);
      gestiones.append(fixed);
    }
  } else if (aviso.kind === 'solicitud-estado') {
    mainRow.append(avisoUploadButton(aviso));
    const fixed = n('button', 'Ya lo corregí', 'soft small');
    fixed.onclick = () => avisoResolve(aviso);
    gestiones.append(fixed);
  } else {
    const fixed = n('button', 'Ya lo corregí', 'primary');
    fixed.onclick = () => avisoResolve(aviso);
    mainRow.append(fixed);
  }
  const enlace = AVISOS_ENLACES[aviso.enlace];
  if (enlace) {
    const go = n('button', enlace[1], 'soft small');
    go.onclick = () => navigate(enlace[0]);
    gestiones.append(go);
  }
  if (mainRow.childNodes.length) card.append(mainRow);
  card.append(gestiones);
  return card;
}



function avisoCambiarResponsable(aviso) {
  const picker = select([['Paco', 'Paco'], ['Contadora', 'La contadora']], aviso.responsable || 'Paco', 'Quién lleva el aviso');
  dialog('¿Quién lo lleva?',
    [n('p', 'Ahora lo lleva: ' + avisoResponsableLabel(aviso) + '. Cámbialo si lo va a resolver la otra persona.'),
     field('Lo lleva', picker)],
    async () => {
      avisosCache = await satApi('notices/responsable', { id: aviso.id, responsable: picker.value });
      avisosFetchedAt = Date.now();
      toast('Ahora lo lleva: ' + (picker.value === 'Contadora' ? 'la contadora' : picker.value) + '.', 'ok');
      render();
    }, 'Guardar');
}
async function avisoAfterChange(message) {
  toast(message, 'ok');
  soundCue('success');
  await refreshAvisos(true);
  render();
}








async function avisoMarkPaid(aviso) {
  try {
    await satApi('notices/answer', { id: aviso.id, respuesta: 'si' });
    await avisoAfterChange('Pagado. Quedó en el historial.');
  } catch (error) { toast(error.message, 'error'); }
}


function avisoMarkPaidDialog(aviso) { return avisoMarkPaid(aviso); }










function avisoHistorialEditar(aviso) {
  const nota = input('text', { placeholder: 'Ej. Pagado con Konfío el 8 de noviembre' });
  const fecha = input('date', {});
  dialog('Editar el cierre',
    [n('p', 'Añade una nota o cambia la fecha del pago de «' + aviso.titulo + '». Es opcional y posterior: el aviso ya quedó cerrado con un toque.'),
     field('Fecha del pago', fecha), field('Nota', nota)],

      await satApi('notices/answer', { id: aviso.id, respuesta: 'si', nota: nota.value.trim(), fecha: fecha.value });

function avisoConfirmNo(aviso) {
  dialog('Confirmar',
    [n('p', aviso.direccion === 'cobrar'
      ? 'Confirmas que ' + (aviso.nombre || 'la contraparte') + ' aún NO ha pagado. El aviso pasará a «Lo que está mal» como saldo vencido: en PacoSAT no consta el pago.'
      : 'Confirmas que aún NO se ha pagado. El aviso pasará a «Lo que está mal» como saldo vencido: en PacoSAT no consta el pago.')],
    async () => {
      await satApi('notices/answer', { id: aviso.id, respuesta: 'no' });
      await avisoAfterChange('Aviso de atraso creado en «Lo que está mal».');
    }, 'Sí, aún no');
}
async function avisoResolve(aviso) {
  try {
    const result = await satApi('notices/resolve', { id: aviso.id });
    if (result.ok) { await avisoAfterChange('Comprobado: ya está bien. Aviso cerrado y guardado en el historial.'); return; }
    dialog('Todavía falta algo',
      [n('p', 'PacoSAT lo volvió a comprobar y aún no está solventado:'),
       n('p', result.falta || 'La condición del aviso sigue presente.', 'error-text'),
       n('p', 'Cuando lo corrijas, vuelve a pulsar «Ya lo corregí» y lo verificamos otra vez.')],
      async () => {}, 'Entendido');
  } catch (error) { toast(error.message, 'error'); }
}


function avisoUploadButton(aviso) {
  const holder = n('span');
  const btn = n('button', 'Subir el estado aquí', 'primary small');
  btn.onclick = async () => {
    try {
      const banks = await satApi('banks');
      const solicitud = aviso.solicitud || {};
      const account = (banks.accounts || []).find(row =>
        row.bank.toLocaleLowerCase('es-MX') === String(solicitud.banco || '').toLocaleLowerCase('es-MX') &&
        (row.missing || []).includes(solicitud.mes));
      check(account, 'No encontré la cuenta de ' + (solicitud.banco || 'ese banco') + ' con ese mes faltante: súbelo desde Bancos.');
      const form = n('div', undefined, 'sat-form');
      const file = input('file', { accept: 'application/pdf' });
      const up = n('button', 'Subir y procesar', 'primary small');
      up.onclick = async () => {
        try {
          check(file.files?.[0], 'Elige el PDF del estado de cuenta.');
          activityStart('Procesando el estado de ' + solicitud.banco + ' de ' + solicitud.mes, 1);
          const content = encode64(new Uint8Array(await file.files[0].arrayBuffer()));
          await satApi('banks/statements', { accountId: account.id, month: solicitud.mes, content });
          activityProgress(1, 'Estado archivado y leído.');
          activityDone('✓ Estado recibido', ['El estado de ' + solicitud.banco + ' de ' + solicitud.mes + ' quedó archivado y leído. Los avisos que dependían de él se re-comprueban solos.']);
          await avisoAfterChange('Estado aportado: la solicitud se solventó.');
        } catch (error) { activityFail('No se pudo procesar el estado', error.message); toast(error.message, 'error'); }
      };
      form.append(fieldWrap('PDF del estado · ' + solicitud.mes, file), up);
      holder.replaceChildren(form);
    } catch (error) { toast(error.message, 'error'); }
  };
  holder.append(btn);
  return holder;
}









const CAPACIDAD_STATE_LABELS = { '✅': 'Incluido y verificado', '🔄': 'En construcción', '📋': 'Planificado' };
let capacidadesDoc = null;
async function loadCapacidades() {
  if (capacidadesDoc) return capacidadesDoc;
  try {
    const response = await fetch('/api/capacidades');
    if (response.ok) capacidadesDoc = await response.json();
  } catch {  }
  if (!capacidadesDoc) {
    try {
      const response = await fetch('capacidades.json');
      if (response.ok) capacidadesDoc = await response.json();
    } catch {  }
  }
  return capacidadesDoc;
}
function capacidadesScreen() {
  const wrap = n('div');
  const loading = panel('Todo lo que tendrá PacoSAT');
  loading.append(n('p', 'Cargando el documento de capacidades…'));
  wrap.append(loading);
  loadCapacidades().then(doc => {
    if (!wrap.isConnected) return;
    if (!doc?.sections?.length) {
      loading.replaceChildren(n('h2', 'Todo lo que tendrá PacoSAT'),
        n('p', 'El documento de capacidades se consulta desde el servidor de tu casa. Ábrelo allí para verlo completo.'));
      return;
    }
    const panels = [];
    const head = panel('Todo lo que tendrá PacoSAT');
    const body = n('div', undefined, 'portal');
    const facts = n('div', undefined, 'facts');
    const fact = (label, value) => { const row = n('div'); row.append(n('small', label), n('strong', value)); return row; };
    facts.append(fact('Versión instalada', 'PacoSAT ' + PACOSAT_META.version),
      fact('Creación del software', stampText(PACOSAT_META.created)),
      fact('Documento actualizado', doc.updated || 'Sin fecha registrada'));
    body.append(facts, n('p', 'Este listado es el documento vivo de capacidades de PacoSAT: su fuente es docs/CAPACIDADES.md del repositorio y esta pantalla se genera desde esa fuente en cada versión. Los estados se actualizan al cerrar cada ronda de mejora.'));
    const counts = { '✅': 0, '🔄': 0, '📋': 0 };
    for (const section of doc.sections)
      for (const block of section.blocks) if (block.type === 'item' && counts[block.state] !== undefined) counts[block.state]++;
    body.append(n('p', counts['✅'] + ' capacidades incluidas y verificadas · ' + counts['🔄'] +
      ' en construcción · ' + counts['📋'] + ' planificadas.'));
    head.append(body);
    panels.push(head);
    for (const section of doc.sections) {
      const panelNode = panel(section.title);
      const list = n('div', undefined, 'portal');
      for (const block of section.blocks) {
        if (block.type === 'p') { list.append(n('p', block.text)); continue; }
        const row = n('div', undefined, 'cap-row');
        const chip = n('span', (block.state || '•') + ' ' + (CAPACIDAD_STATE_LABELS[block.state] || 'Nota'), 'tag');
        row.append(chip, n('span', block.text));
        list.append(row);
      }
      panelNode.append(list);
      panels.push(panelNode);
    }
    wrap.replaceChildren(...panels);
  });
  return [wrap];
}
