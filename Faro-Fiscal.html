/* Indicador de actividad global y Centro de Avisos (1.7.4) */
.activity-dock{position:sticky;top:8px;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.activity-dock-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.activity-spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--green);animation:pacosat-spin 0.8s linear infinite;flex:none}
@keyframes pacosat-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.activity-spinner{animation:none}}
.activity-count{color:var(--muted);font-variant-numeric:tabular-nums}
.activity-dock meter{width:100%;height:10px;margin-top:8px}
.activity-detail{margin:6px 0 0;color:var(--muted);font-size:.92em;word-break:break-all}
.activity-result{background:var(--ok-bg);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.activity-result-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.activity-result p{margin:6px 0}
.aviso-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.aviso-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.aviso-card p{margin:4px 0}
.ok-text{color:var(--ok-ink)}

.metric,.panel{border-radius:13px;box-shadow:0 2px 5px #2742640b}
.metric{padding:17px}.metric strong{font-size:30px}
.metric-label svg{box-sizing:content-box;padding:6px;border-radius:8px;background:var(--info-bg);color:var(--info-ink)}
.metric:nth-child(2) .metric-label svg{background:var(--ok-bg);color:var(--ok-ink)}
.metric:nth-child(3) .metric-label svg{background:var(--chip-bg);color:var(--chip-ink)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.panel-head{padding:16px 17px}.panel-head h2{font-size:18px}
.panel th{background:var(--surface-2)}.panel tbody tr:hover{background:var(--surface-2)}
.panel td:first-child{min-width:120px}
.guide{background:var(--guide-bg);border-color:var(--border)}
.filters{background:var(--surface)}.filters button{margin-left:auto}
.wide-dialog{width:min(990px,calc(100% - 24px));max-height:94vh}

.actions{flex-wrap:wrap}#form{max-height:inherit}.dialog-actions{position:sticky;bottom:0;background:var(--surface);padding-top:6px}
/* KPI del panel principal */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:15px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 2px 5px #2742640b;padding:15px 17px;display:grid;gap:4px;min-width:0}
.kpi-label{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;font-size:13px}
.kpi-label svg{color:var(--green)}
.kpi strong{font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.kpi.split strong{font-size:20px}
/* Gráfico SVG de totales por mes */
.chart-wrap{padding:6px 17px 14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .bar-issued{fill:var(--green)}
.chart .bar-received{fill:var(--chart-received)}
.chart .grid-line{stroke:var(--border);stroke-width:1}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 17px 14px;color:var(--muted);font-size:12.5px;font-weight:600}
.chart-legend span{display:inline-flex;gap:6px;align-items:center}
.chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart-legend .sw-issued{background:var(--green)}.chart-legend .sw-received{background:var(--chart-received)}
/* Reporte imprimible */
#print-report{display:none}
.report-head{border-bottom:3px solid var(--green);padding-bottom:10px;margin-bottom:14px}
.report-head h1{font-size:24px;margin:2px 0}
.report-meta{color:var(--muted);font-size:13px}
.report-note{font-size:12.5px;color:var(--muted);margin-top:12px}
@media print{
  .frame{display:none!important}
  #print-report{display:block!important;color:#000;background:#fff}
  #print-report table{width:100%;border-collapse:collapse}
  #print-report th,#print-report td{border:1px solid #bbb;padding:6px 8px;text-align:left;font-size:12.5px}
  #print-report .panel{border:none;box-shadow:none}
}

/* Vigilancia SAT rediseñada: acciones grandes, tarjetas con semáforo
   y la línea de verdad de la revisión automática. */

.monitor-action h3{font-size:16px}
.monitor-action p{font-size:13.5px}
.monitor-dates{display:flex;gap:10px;flex-wrap:wrap}
.monitor-dates label{display:grid;gap:5px;font-weight:600;font-size:13px;color:var(--muted)}

.monitor-link{font-size:13px}
.monitor-truth{display:grid;gap:3px;padding:0 17px 15px;color:var(--muted);font-size:13.5px}
.monitor-truth p{margin:0}
.kpi.ok strong{color:var(--ok-ink)}
.kpi.bad strong{color:var(--danger)}
.kpi.warn strong{color:var(--warn-ink)}
@media(max-width:460px){.monitor-actions{padding:10px}.monitor-dates label{flex:1 1 130px}}

/* Cobertura (1.6.4): mapa de calor anual de días cubiertos por RFC. */
.hm-scroll{overflow-x:auto;padding:2px 17px 6px}
.hm{display:block;height:auto}
.hm rect.hm-l0{fill:var(--surface-2);stroke:var(--border);stroke-width:.6}
.hm rect.hm-l1{fill:var(--chart-received);opacity:.5}
.hm rect.hm-l2{fill:var(--chart-received)}
.hm text{fill:var(--muted);font-size:9px;font-weight:600}
.chart-legend .sw-hm0{background:var(--surface-2);border:1px solid var(--border)}
.chart-legend .sw-hm1{background:var(--chart-received);opacity:.5}
.chart-legend .sw-hm2{background:var(--chart-received)}

/* Pulido 1.6.5: anillo de estados, esqueletos de carga, línea de tiempo
   del CFDI y buscador global. Todo con tokens del sistema de diseño; la
   regla global de reduced-motion ya anula la animación del esqueleto. */
.donut{display:block;margin:0 auto;max-width:190px;height:auto}
.donut-track{fill:none;stroke:var(--surface-2);stroke-width:13}
.donut-seg{fill:none;stroke-width:13}
.donut-vigente{stroke:var(--green)}
.donut-cancelado{stroke:var(--danger)}
.donut-efos{stroke:var(--warn-ink)}
.donut-sin{stroke:var(--border)}
.donut-total{fill:var(--ink);font-size:26px;font-weight:800;text-anchor:middle}
.donut-caption{fill:var(--muted);font-size:10px;font-weight:700;text-anchor:middle}
.chart-legend .sw-donut-vigente{background:var(--green)}
.chart-legend .sw-donut-cancelado{background:var(--danger)}
.chart-legend .sw-donut-efos{background:var(--warn-ink)}
.chart-legend .sw-donut-sin{background:var(--border)}
.skel{display:grid;gap:12px}
.skel-block{min-height:86px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(100deg,var(--surface-2) 40%,var(--surface) 50%,var(--surface-2) 60%);background-size:200% 100%;animation:skel-pulse 1.2s ease-in-out infinite}
@keyframes skel-pulse{from{background-position:180% 0}to{background-position:-20% 0}}
.timeline{display:grid}
.timeline-item{display:grid;gap:1px;padding:7px 0 7px 13px;border-left:2px solid var(--border)}
.timeline-item strong{font-size:13.5px}
.timeline-item small{color:var(--muted)}
.timeline-empty{color:var(--muted);margin:4px 0}
.top-search input{background:var(--nav-field);border:1px solid var(--nav-border);color:var(--nav-text);border-radius:8px;padding:6px 10px;min-width:200px;font:inherit;font-size:13px}
.top-search input::placeholder{color:var(--nav-muted)}
@media(max-width:900px){.top-search input{min-width:120px;width:38vw}}

.app-footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.brand .logo img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.report-logo{max-height:54px;max-width:190px;object-fit:contain;margin-bottom:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:inline-flex;gap:7px;align-items:center;padding:7px 10px}
.swatch[aria-pressed="true"]{border-color:var(--green);background:var(--tint);color:var(--ok-ink)}
.swatch-dot{width:15px;height:15px;border-radius:50%;display:inline-block;border:1px solid var(--border)}
.logo-preview{width:52px;height:52px;object-fit:contain;border:1px solid var(--border);border-radius:10px;background:var(--surface)}

/* Visor CFDI profesional (1.6.7) y datos «Acerca de» (1.6.6). */
.cfdi-dialog{width:min(940px,calc(100% - 24px))}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:10px 0}
.facts>div{display:grid;gap:2px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;min-width:0}
.facts small{color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.08em}
.facts strong{font-size:13.5px;overflow-wrap:anywhere}
.seal-details{margin:8px 0;border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.seal-details summary{cursor:pointer;font-weight:650}
.seal-details pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:130px;overflow:auto}
.print-seals{font-size:9.5px;overflow-wrap:anywhere}
.print-seals p{margin:3px 0}
.cap-row{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
.cap-row .tag{flex:none;margin-top:1px}

/* ===== 1.6.11 · Semáforos, Hoy, un clic ===== */
:root{--pill-ok-bg:#e2f1e6;--pill-ok-ink:#14532d;--pill-warn-bg:#fdf0d2;--pill-warn-ink:#7a4a00;--pill-bad-bg:#fde3e0;--pill-bad-ink:#8f1d17;--pill-dim-bg:#eceff3;--pill-dim-ink:#4b5563}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){--pill-ok-bg:#173a26;--pill-ok-ink:#9fd8b0;--pill-warn-bg:#4a380f;--pill-warn-ink:#ffd88a;--pill-bad-bg:#4c1d1a;--pill-bad-ink:#ffb3ab;--pill-dim-bg:#2a2f36;--pill-dim-ink:#c3cad2}}
html[data-theme="dark"]{--pill-ok-bg:#173a26;--pill-ok-ink:#9fd8b0;--pill-warn-bg:#4a380f;--pill-warn-ink:#ffd88a;--pill-bad-bg:#4c1d1a;--pill-bad-ink:#ffb3ab;--pill-dim-bg:#2a2f36;--pill-dim-ink:#c3cad2}
.status-pill{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:6px 12px;font-size:13px;font-weight:650;border:1px solid transparent;cursor:pointer}
.status-pill .pill-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.status-pill[data-state="ok"]{background:var(--pill-ok-bg);color:var(--pill-ok-ink)}
.status-pill[data-state="warn"]{background:var(--pill-warn-bg);color:var(--pill-warn-ink)}
.status-pill[data-state="bad"]{background:var(--pill-bad-bg);color:var(--pill-bad-ink)}
.status-pill[data-state="dim"]{background:var(--pill-dim-bg);color:var(--pill-dim-ink)}
.traffic-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.today-line{padding:0 15px 6px}
.next-step{margin:6px 15px 15px;padding:13px 15px;border:1px solid var(--border);border-radius:11px;background:var(--guide-bg);display:grid;gap:6px;justify-items:start}
.rest-switch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rest-label{display:grid;gap:1px}
.rest-label small{color:var(--muted);font-size:12px}
.rest-toggle[aria-pressed="true"]{background:var(--pill-warn-bg);color:var(--pill-warn-ink);border-color:transparent}
.filter-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:0 15px}
.filter-chips:not(:empty){padding:10px 15px;border-top:1px solid var(--border)}
.filter-chip{border-radius:100px;padding:5px 11px;font-size:12.5px;background:var(--surface-2)}
.pw-eye{padding:5px 8px;margin-top:4px;justify-self:start}
.activity-link{cursor:pointer}
.activity-link:hover{background:var(--surface-2)}
.legend-item{background:none;border:none;padding:2px 4px;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.hm-detail{padding:0 15px 13px;color:var(--muted)}
.side-version{color:var(--nav-muted);font-size:12px;padding:0 4px}
body.drag-active::after{content:"Suelta los archivos para importar";position:fixed;inset:auto 0 22px 0;margin:0 auto;width:max-content;max-width:92vw;background:var(--green);color:var(--on-accent);padding:11px 18px;border-radius:100px;font-weight:700;z-index:60;box-shadow:0 10px 30px var(--shadow-color)}
td button{padding:7px 10px}
/* Listas negras (1.6.13) */
.cp-row{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.cp-row:last-child{border-bottom:0}
.cp-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.cp-hit{font-size:12.5px;font-weight:600}
.cp-hit.sev-bad{color:var(--bad,#b3261e)}
.cp-hit.sev-warn{color:var(--warn,#9a6a00)}
.cp-hit.sev-ok{color:var(--ok,#1e7d32)}
.ok-note{color:var(--ok,#1e7d32);font-weight:600}
/* Constancias y opinión (1.6.14) */
.satdoc-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.satdoc-form input[type="number"]{width:64px}
.satdoc-form input[type="text"]{flex:1;min-width:220px}
.switch-line{display:inline-flex;gap:8px;align-items:center;font-weight:600}

/* Libro de criterios, planificador y rescate (ronda anti-5002) */
.plan-note{margin:0 0 8px;color:var(--muted,#666)}
.rescue-folios{margin:8px 0;padding-left:20px;font-size:.92em;word-break:break-all}
.rescue-steps{margin:8px 0;padding-left:20px}
.rescue-steps li{margin-bottom:6px}
.aviso-next{font-weight:600;color:var(--ink)}
.reconcile-candidate{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel-2)}
.decl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.decl-cell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.decl-cell span{font-size:12px;color:var(--muted)}
.decl-recuperada{border-color:var(--ok);background:var(--tint)}

<script>const PACOSAT_META = {"version":"1.10.0","created":"2026-11-08T13:42:35-06:00"};
const PACOSAT_CAPACIDADES = {"updated":"9 nov 2026, 20:48 CST","sections":[{"title":"1. Núcleo CFDI","blocks":[{"type":"item","state":"✅","text":"Importación de XML y ZIP con validación, y vinculación de PDF."},{"type":"item","state":"✅","text":"IMPORTACIÓN VISIBLE (1.7.4, pieza 1): ninguna acción larga queda «en silencio»: un panel fijo dice qué se está haciendo con contador real («Procesando X de N» por entradas del ZIP o de la carpeta) y barra de progreso; al terminar una importación grande, el resumen «✓ Procesado» queda FIJO en pantalla hasta cerrarlo (nuevos con desglose emitidos/recibidos y por mes, duplicados, por revisar con el motivo de cada uno y qué hacer, y archivos no procesados con su motivo). «Importar carpeta» está a 2 toques desde Facturas y lee la estructura tipo OneFacture (Emitidos/Recibidos/año/mes) por el mismo pipeline que los sueltos, los ZIP y los paquetes del SAT."},{"type":"item","state":"✅","text":"Visor CFDI profesional: datos completos, conceptos e impuestos, cadena original, Timbre Fiscal, complemento de Pagos 2.0 y representación impresa."},{"type":"item","state":"✅","text":"Vinculación PDF ↔ XML por UUID: el PDF de la factura se lee, se detecta su folio fiscal y se vincula al XML del mismo UUID (con cotejo de RFC); el importe del PDF no se compara con el del XML."},{"type":"item","state":"✅","text":"Línea de tiempo por CFDI y buscador global."},{"type":"item","state":"✅","text":"Mapa de cobertura por periodos y gráfica de estados. (En el anillo de estados, «No encontrado» se suma dentro de «Sin consulta»; el detalle de cada CFDI sí muestra «No encontrado» como estado propio.)"},{"type":"item","state":"✅","text":"Persistencia del desglose fiscal al importar (subtotal, IVA por tasa, IEPS, retenciones, método/forma de pago, uso CFDI, tipo de cambio, serie/folio) con re-parseo histórico: base de la DIOT (1.6.16; la relación de pagos se sumó en la 1.6.17)."},{"type":"item","state":"✅","text":"Detector al importar de duplicados por UUID y de CFDI cuyo RFC no corresponde al expediente; el detector de totales que no cuadran y de folios repetidos con otro UUID actúa sobre lo ya guardado (pantalla Cumplimiento, 1.6.18)."}]},{"title":"2. Descarga y vigilancia del SAT","blocks":[{"type":"item","state":"✅","text":"Descarga masiva oficial por Web Service con e.firma (SDK), por RFC y dirección (emitidos/recibidos), con paquetes ZIP."},{"type":"item","state":"✅","text":"Perfiles multi-RFC con cadencia propia (Mano Fil: cada 360 min, ventana 7 días, ambas direcciones)."},{"type":"item","state":"✅","text":"Vigilancia de estado de cada CFDI cada 24 h y de cancelaciones."},{"type":"item","state":"✅","text":"Escudo de criterios 5002 (ronda anti-5002, 1.7.1): ningún criterio (ventana con los segundos exactos + dirección + RFC + tipo de solicitud) se envía dos veces en la vida. El libro de criterios es permanente y toda ruta lo consulta antes de pedir; la única salida al SAT, `sendSatRequest`, rechaza con guardia 409 cualquier criterio con usos previos o marcado agotado, incluidas las intenciones «enviando» que quedaron a medias — la última solicitud idéntica nunca se gasta (ya no hay confirmación posible para repetirla). La salida es siempre la variante de cierre +1 s (el inicio nunca se mueve: no se pierde el primer segundo ni quedan huecos entre ventanas): la descarga programada la aplica sola y la manual la ofrece en un clic. El PLANIFICADOR ensaya cada solicitud sin gastar cupo (mismo código que construye el criterio de verdad) y, si un rango CFDI nuevo supera 31 días, propone pedir primero Metadata. El LIBRO DE CRITERIOS se ve por RFC en Centro SAT (qué se pidió, cuándo, por qué vía y en qué estado quedó: sin usar, usado, quemado 5002 o rescatado). Y si el SAT devuelve un 5002 (por ejemplo, un criterio gastado antes por otra app), el criterio queda marcado quemado con su explicación y el RESCATE asistido prepara la lista de folios pendientes para bajarlos por el portal (canal aparte, hasta 2.000 XML/día); lo que entra por la carpeta vigilada dentro de una ventana quemada la marca «rescatada»."},{"type":"item","state":"✅","text":"Solicitudes Metadata (hasta 1.000.000 de registros ligeros por petición) para reconciliar cobertura (1.6.10): automáticas una al día por RFC y a petición por periodo; los CFDI que el SAT conoce y faltan en XML se listan en Cobertura."},{"type":"item","state":"✅","text":"Recibidos SIN filtro de «solo vigentes», registrando el estado inicial de cada CFDI (1.6.10): el conector ya no envía filtro de estado y el estado inicial llega de los metadatos al detalle del CFDI."},{"type":"item","state":"✅","text":"Blindaje (1.6.15): intención registrada ANTES de enviar («presunto enviado» al arrancar, con aviso), base de datos con synchronous=FULL a prueba de cortes, timeout duro de 60 s en llamadas al SAT con vigilante del ciclo (aviso si un ciclo pasa de 10 minutos), y contador de descargas por paquete con tope 5008: a los 2 intentos la solicitud se cierra en un estado terminal claro con aviso y salida accionable."},{"type":"item","state":"✅","text":"Carpeta vigilada recursiva: todo CFDI que caiga en la carpeta entra solo."},{"type":"item","state":"✅","text":"Solicitudes frecuentes EN UN CLIC (1.6.10) («mes pasado completo», «este trimestre», «este año») sin teclear fechas: menos errores y menos criterios 5002 quemados por un dedo mal puesto."},{"type":"item","state":"✅","text":"AVISO DE SILENCIO **CONFIGURABLE** + MODO DESCANSO CON **INTERRUPTOR ON/OFF** (petición expresa de Paco: visual, práctico e intuitivo): un interruptor grande y visible — general en la pantalla «Hoy» y uno por RFC — para encender/apagar la vigilancia en un toque, con el estado siempre claro («Vigilando» / «Descansando») y opción de «descansar hasta el [fecha]». Si pasan los días que Paco defina sin entrar ningún CFDI, aviso de posible fallo; durante el descanso no hay descargas ni avisos, y al reanudar el sistema se pone al día solo. El sistema también descansa."},{"type":"item","state":"✅","text":"Respaldo cifrado programado en el servidor."},{"type":"item","state":"✅","text":"Respaldo partido por RFC y año (1.7.0): desde la pantalla de Respaldos se genera manualmente un .faro por ejercicio y empresa, restaurable por partes con el restaurador de siempre."},{"type":"item","state":"✅","text":"COPIA EXTERNA AUTOMÁTICA del respaldo (la copia en sí desde 1.6.4; la vigilancia de antigüedad desde 1.6.15): cada respaldo cifrado se copia solo a un segundo destino FUERA del NAS, con semáforo de antigüedad de la copia en Salud y alerta si lleva más de 7 días sin copia buena o si la copia falla — si el NAS muriera, el archivo fiscal no muere con él. **DESTINO DECIDIDO (Paco, 8 nov 2026): Google Drive, vía Cloud Sync nativo del NAS; la carpeta secundaria del respaldo vive dentro de la carpeta sincronizada (p. ej. «PacoSAT Respaldos»). A Drive solo llega el archivo CIFRADO.**"}]},{"title":"3. Listas negras (art. 69, 69-B y 69-B Bis)","blocks":[{"type":"item","state":"✅","text":"(Fuera de la app) Cruce manual de contrapartes contra los 16 listados oficiales guardados en ~/workspace/pacosat-listas-sat/, hecho el 8 nov 2026: todas las contrapartes con XML en el expediente salieron limpias. Dentro de la app, la vigilancia continua trabaja con el catálogo de 10 listados de la viñeta siguiente."},{"type":"item","state":"✅","text":"Descarga automática y continua de los listados oficiales desde Datos Abiertos del SAT: 69-B y 69-B Bis desde el blob oficial del minisitio y los supuestos del art. 69 desde el paquete oficial del SAT en datos.gob.mx; los supuestos CSD sin efectos y Reducción art. 74 se cargan por archivo (sin CSV oficial verificado) y el motor los trata igual (1.6.13)."},{"type":"item","state":"✅","text":"Padrón de empresas a monitorear (clientes/proveedores): se puebla solo desde los CFDI; alta uno por uno y carga masiva por Excel o CSV (Nombre, RFC, Nota) leída en la propia app (1.6.13)."},{"type":"item","state":"✅","text":"Validador manual por RFC y por nombre/razón social (69, 69-B o ambas), en tiempo real contra todos los listados cargados (1.6.13)."},{"type":"item","state":"✅","text":"Alertas ante CUALQUIER transición (entradas, salidas, desvirtuados; también la línea base inicial) con la exposición por empresa (importes y CFDI en riesgo), alarma si un listado lleva >48 h sin actualizarse y panel «cómo voy» con semáforo por contraparte (1.6.13)."},{"type":"item","state":"✅","text":"Constancia de validación por empresa (fecha, listados consultados y resultado) como documento imprimible, listo para imprimir o guardar como PDF desde el diálogo de impresión (1.6.13)."}]},{"title":"4. e.firma y RFC que maneja","blocks":[{"type":"item","state":"✅","text":"Perfil de Mano Fil (MFI6212158B4) con su e.firma en la carpeta protegida del NAS. (Su e.firma caducó el 30-oct-2024: el perfil existe y sus archivos están en la carpeta protegida, pero no puede descargar del SAT hasta renovarla.)"},{"type":"item","state":"✅","text":"Subida de e.firma DESDE LA APP por RFC (.cer/.key + contraseña en pantalla), con validación inmediata de pareja, RFC y caducidad antes de guardar nada; queda en la carpeta protegida del servidor y se reactiva sola tras reiniciar; nunca a la base de datos ni a los respaldos (1.6.12)."},{"type":"item","state":"🔄","text":"Multi-RFC ampliado: Mano Fil, Elemental Denim (EDE1902136T2), el RFC personal de Paco y los de Rodrigo y José Javier — la arquitectura lo admite sin cambios desde la 1.4; cada perfil se activa cuando aporten su e.firma (la e.firma se coloca en persona, nunca por chat)."}]},{"title":"5. Constancias y opiniones (solo SAT)","blocks":[{"type":"item","state":"🔄","text":"Descarga mensual automática, activable por RFC, de la constancia de situación fiscal y la opinión de cumplimiento del SAT: desde la 1.9.0 la descarga es REAL, con un navegador Chromium dentro del propio contenedor (sidecar): entra por el lanzador estable del portal con la e.firma, deja que el portal firme el reto y captura el PDF de la respuesta del navegador (nunca se re-pide por HTTP); la llave .key cifrada en AES-256 se re-cifra temporalmente a 3DES solo en memoria, como exige el portal; la opinión se captura también en su fase final de PDF en Base64. Primero se intenta la vía HTTP directa y, si el portal exige el paso interactivo, entra el navegador. Probado de punta a punta con Chromium real contra un portal simulado equivalente; la primera corrida contra el portal de verdad queda pendiente de hacerse con la e.firma de la app. La subida manual del PDF sigue funcionando y vale igual para el semáforo."},{"type":"item","state":"✅","text":"Semáforo de vigencia (verde <60 días, ámbar 60–90, rojo >90) y alerta si una renovación falla o vence (1.6.14)."},{"type":"item","state":"🔄","text":"Envío por correo de la constancia/opinión recién descargada a uno o varios destinatarios (día, hora y destinatarios se configuran en la pantalla de Constancias): el envío sale automáticamente tras una descarga con éxito. No hay envío programado independiente de la descarga."}]},{"title":"5 bis. Declaraciones y acuses (1.9.0)","blocks":[{"type":"item","state":"🔄","text":"Recuperación de declaraciones PRESENTADAS y sus acuses desde el portal, con la misma sesión de e.firma del descargador y DOS conectores separados: mensuales (búsqueda por ejercicio con reimpresión de acuses) y anual (generación de su PDF). En Expedientes, la declaración y el acuse son documentos DISTINTOS, con tipo, ejercicio/periodo, fecha de presentación y número de operación. La rejilla por ejercicio dice qué periodos están recuperados, cuáles faltan y cuáles aún no tocan. Probado contra portal simulado; los selectores reales del portal se confirman en la primera corrida real."}]},{"title":"6. Salidas: reportes, impresión, exportaciones y correo","blocks":[{"type":"item","state":"✅","text":"Representación impresa del CFDI y paquete mensual para la contadora, ampliado en la 1.9.0: conciliaciones del mes, movimientos sin identificar, cancelaciones (con aviso si alguna ya estaba pagada), faltantes de descarga, complementos pendientes con su plazo (día 5 del mes siguiente), revisión de complementos por UUID/importe/fecha/forma, alertas de PUE con complemento asociado (meta cero) y de PUE sin pagar o pagado con forma distinta, inconsistencias de forma de pago (PPD≠99, PUE=99), bitácora de avisos de Buzón y de correo, saldos PPD con el pendiente REAL y la lista de revisión de la contadora en 12 puntos. La pantalla de cierre usa la MISMA lista de comprobación calculada en el servidor (10 pasos con cifras)."},{"type":"item","state":"✅","text":"Centro de reportes por periodo y contraparte, con la identidad de la app (pantalla «Salidas», imprimible y en CSV) (1.6.16)."},{"type":"item","state":"✅","text":"Impresión cuidada de las pantallas con reporte e impresión por lote de CFDI en un solo documento desde la selección de Facturas (1.6.16, sobre la representación completa de la 1.6.7)."},{"type":"item","state":"✅","text":"Exportaciones CSV con formato (reporte del mes, base DIOT con desglose) y programables vía los informes automáticos (1.6.16). (No se genera Excel/XLSX: el Excel solo se *lee* en la carga masiva del padrón de Listas.)"},{"type":"item","state":"✅","text":"EXPORTACIÓN COMPLETA LEGIBLE en un clic: todos los XML y PDF con su índice, en carpetas por RFC y año, sin depender del formato de respaldo — tus datos son tuyos y salen enteros cuando quieras (1.6.16)."},{"type":"item","state":"✅","text":"Comparativas AÑO CONTRA AÑO por contraparte: de un vistazo, quién te factura más que antes y qué gasto se está disparando (1.6.16)."},{"type":"item","state":"✅","text":"Correo DENTRO de la app: enviar CFDI, reportes y constancias con adjuntos del expediente, bitácora de envíos visible y botón de correo de prueba (el de prueba llegó en la 1.6.11) (1.6.16)."},{"type":"item","state":"✅","text":"Informe mensual AUTOMÁTICO a Nora: paquete del mes construido en el servidor (índice, XML, documentos, base DIOT con el desglose fiscal persistido, novedades de listas negras y PPD del mes), con día, hora y destinatarios configurables y envío manual inmediato (1.6.16)."},{"type":"item","state":"✅","text":"IVA DEL MES estimado por RFC (trasladado y acreditable desde el desglose; lo que no tiene desglose se señala para reprocesarlo, nunca se estima a ojo) y re-parseo histórico de los XML guardados sin contactar al SAT (1.6.16, mejora nº 6)."},{"type":"item","state":"✅","text":"CIERRE DE MES GUIADO: lista de comprobación paso a paso con semáforo por paso y acceso directo a donde se resuelve cada punto (1.6.16)."},{"type":"item","state":"✅","text":"Resumen semanal ejecutivo por correo (lunes): CFDI nuevos, solicitudes terminadas, cambios en listas y avisos de la semana, enlazado con la bitácora (1.6.16)."},{"type":"item","state":"✅","text":"CORREO-RESUMEN DE AVISOS (1.7.4, pieza 2): los avisos ya NUNCA llegan de uno en uno (se acabó la avalancha de un correo por factura): como mucho sale UN correo con el resumen de lo que espera en el Centro de Avisos, con cadencia configurable (diario / solo lunes / solo cuando haya algo importante / sin correo). El informe mensual a Nora y el resumen semanal de arriba son correos aparte, con su propio interruptor."}]},{"title":"7. Dinero","blocks":[{"type":"item","state":"✅","text":"Conciliación bancaria CFDI ↔ movimientos: cruceta por importe y fecha con pagado/no pagado, pagos sin factura y facturas sin pago — desde CSV (1.6.17) o desde los estados archivados de Bancos (1.6.19)."},{"type":"item","state":"✅","text":"CONCILIACIÓN ASISTIDA (1.9.0): sobre los movimientos archivados, el servidor PROPONE vínculos movimiento↔factura↔complemento EXPLICANDO el porqué de cada uno (importe igual al total o al saldo pendiente, fecha cercana, misma moneda, el concepto nombra a la contraparte o trae el folio fiscal), con pagos parciales y multi-factura (un movimiento que suma dos saldos). Confirmar persiste la decisión; «Deshacer» la revierte sin borrar el historial; y un movimiento sin factura legítimo (una comisión) se marca y deja de estorbar en los «sin identificar»."},{"type":"item","state":"✅","text":"Cuentas por cobrar Y por pagar: relación pagos↔facturas persistida (los documentos relacionados de cada complemento de pago viajan en el desglose), saldos con antigüedad por contraparte (1.6.17). Los avisos de esos saldos los genera desde la 1.7.4 el Centro de Avisos (sección 7 ter): con el calendario de pago de cada contraparte, preguntando antes y con textos veraces."},{"type":"item","state":"✅","text":"Alerta ROJA de cancelación post-pago: CFDI cancelado que ya tenía pagos registrados escala el aviso del monitor y nombra el importe pagado; la pantalla Dinero los lista en rojo (1.6.17). Desde la 1.7.4 el aviso vive en el Centro de Avisos («Lo que está mal», severidad alta) y solo viaja dentro del correo-resumen."},{"type":"item","state":"✅","text":"Expediente 360 por contraparte: CFDI, pagos, saldos, situación en listas y documentos en una sola tarjeta (1.6.17)."},{"type":"item","state":"✅","text":"Detector de FACTURAS ESPERADAS: el proveedor recurrente (facturó en al menos 3 de los últimos 6 meses) que este mes no ha llegado genera aviso a partir del día 10 y aparece en Dinero (1.6.17)."}]},{"title":"7 bis. Bancos (apartado propio — entra en esta construcción por orden de Paco, 8 nov 22:46)","blocks":[{"type":"item","state":"✅","text":"Archivo de estados de cuenta por BANCO, CUENTA y MES: subes el estado (PDF) y queda guardado y ordenado, sin carpetas a mano; alta libre de bancos y cuentas con atajos para BBVA (cuenta y fondo), Santander (cheques y FONSER1) y Konfio (1.6.19)."},{"type":"item","state":"✅","text":"LECTURA AUTOMÁTICA de cada estado: saldos inicial/final, abonos y cargos y movimientos leídos del documento (formatos BBVA y Santander y genérico por etiquetas). Lo que no se lee con seguridad NO se inventa: el estado queda «a revisar» y se confirman las cifras a mano en la misma pantalla (1.6.19)."},{"type":"item","state":"✅","text":"CADENA DE SALDOS verificada mes a mes (el final de un mes = el inicial del siguiente; si no cuadra, semáforo rojo con la explicación de ambos importes) y SEMÁFORO DE FALTANTES por cuenta (1.6.19)."},{"type":"item","state":"✅","text":"POSICIÓN TOTAL: cuánto hay en cada banco y en total (cuentas y fondos), con su fecha — la foto bancaria completa en una pantalla (1.6.19)."},{"type":"item","state":"✅","text":"Es la base de la conciliación CFDI↔banco (sección 7): la pantalla Dinero consume los movimientos archivados con «Usar movimientos de Bancos» (1.6.19)."}]},{"title":"7 ter. Centro de Avisos (1.7.4, pieza 2 — punto 17 del alcance)","blocks":[{"type":"item","state":"✅","text":"PANEL DENTRO DEL SISTEMA: resumen en «Hoy» y pantalla propia «Avisos» con contador en la navegación. Tres clases siempre visibles: LO QUE ESTÁ MAL, LO QUE FALTA y LO QUE EL SISTEMA NECESITA DE TI. Cada aviso dice qué pasa, por qué importa, el importe cuando aplica, y lleva un botón que conduce a donde se arregla."},{"type":"item","state":"✅","text":"SOLVENTAR DE VERDAD: «Ya lo corregí» re-comprueba la condición real (si sigue mal, explica qué falta; si ya está bien, cierra el aviso y lo guarda en el historial visible). «Marcar pagado a mano» exige nota (fecha/medio, ej. «pagado con Konfío») y queda en bitácora; cuando el pago se enlaza de verdad (complemento o conciliación), el aviso se cierra solo."},{"type":"item","state":"✅","text":"PREGUNTAR ANTES: ningún cobro/pago se declara atrasado sin preguntar. Al vencer el calendario nace la pregunta («Ayer fue el día de pago de X y no consta el pago. ¿Ya pagaron?») con «Sí, ya pagó» / «No, aún no»; solo el «No» crea el aviso de atraso, y con texto veraz: «no consta el pago en PacoSAT», nunca «sin pagar»."},{"type":"item","state":"✅","text":"CALENDARIO POR CONTRAPARTE: día de pago del mes y/o plazo en días en la ficha de cada contraparte (visible también en el Expediente 360 de Dinero). Antes de vencer: «en plazo», sin aviso. Chedraui viene precargado con su día 10. Sin calendario, manda la regla general (30 días por pagar / 60 por cobrar)."},{"type":"item","state":"✅","text":"LÍNEA BASE SILENCIOSA: importar un histórico (o la primera evaluación sobre datos ya existentes) crea la foto inicial SIN avisos retroactivos ni correos: lo histórico vive solo en el panel, marcado «línea base»."},{"type":"item","state":"✅","text":"SOLICITUDES INTERNAS: lo que el sistema necesita (p. ej. el estado de cuenta de Konfío de un mes para conciliar) se pide DENTRO del panel, con la subida en la propia tarjeta; al aportarlo se procesa y los avisos que dependían de él se solventan solos. Nada se pide por correo."},{"type":"item","state":"✅","text":"AVISOS POR RFC (1.9.0): cada aviso lleva como datos el RFC propio al que pertenece, quién lo resuelve (Paco o la contadora, reasignable en la propia tarjeta), su fecha de vencimiento y el siguiente paso en una línea; la pantalla se filtra por RFC cuando hay varios con avisos."}]},{"title":"7 quáter. Pagos al banco (1.10.0)","blocks":[{"type":"item","state":"✅","text":"Pantalla «Pagos al banco»: catálogo de beneficiarios por RFC dueño con banco, cuenta BBVA o CLABE validadas al guardar (dígito de control 3-7-1 de la CLABE incluido) y precarga verificada de los beneficiarios de Mano Fil (García Rivera, Brisbane, Aceros y Consultores BG)."},{"type":"item","state":"✅","text":"«Preparar los pagos del mes»: cruza los CFDI recibidos del mes con el catálogo por RFC del emisor — sin filtrar por el saldo de Dinero, que da las PUE por pagadas; se excluye solo lo marcado pagado a mano o lo conciliado contra un movimiento del banco — y avisa de las facturas cuyo emisor no está en el catálogo."},{"type":"item","state":"✅","text":"Tablas espejo de las rejillas del banco (grupo BBVA: cuenta e importe; grupo interbancario: nombre, CLABE, importe, motivo, RFC e IVA) con clic-para-copiar por celda y descargas .txt etiquetada y JSON. Las líneas interbancarias que superan el tope de $49,999.99 observado en la rejilla del banco el 9 nov 2026 se apartan solas para pagarse por SPEI individual. Aquí solo se prepara: el banco lo firma Paco, nada sale de esta pantalla hacia el banco."},{"type":"item","state":"✅","text":"Solo del administrador: el invitado no ve el catálogo ni las preparaciones (ninguna ruta /api/pagos/* está en su alcance). El respaldo incluye las dos tablas nuevas (pay_beneficiaries y pay_preparations), con prueba de restauración real en la suite de la ronda."}]},{"title":"8. Cumplimiento","blocks":[{"type":"item","state":"✅","text":"Calendario fiscal por RFC (día 17 de provisionales y DIOT, anual del 31 de marzo, caducidad de la e.firma, constancias que cumplen 90 días y lo que captures a mano) con semáforo y aviso por correo 3 días antes (1.6.18)."},{"type":"item","state":"✅","text":"IVA del mes estimado por RFC (trasladado y acreditable desde el desglose persistido): la foto fiscal del mes antes de que la arme la contadora (1.6.16, en Salidas)."},{"type":"item","state":"✅","text":"Paquete de defensa por periodo en un clic: XML del mes con índice, validación de listas de cada contraparte y constancias/opiniones vigentes, listo para SAT o banco (1.6.18)."},{"type":"item","state":"✅","text":"Detector de errores y duplicados al revisar lo guardado: folio repetido con otro UUID, receptor que no es ningún perfil y totales que no cuadran con el desglose (1.6.18)."},{"type":"item","state":"✅","text":"Validador de RFC con estructura y fecha (al dar de alta un contribuyente)."},{"type":"item","state":"✅","text":"Reglas de clasificación automática por contraparte/concepto (la categoría se escribe en las facturas al aplicarlas) y aviso de ANOMALÍAS: importe inusual de un proveedor recurrente o posible duplicado aproximado (1.6.18)."}]},{"title":"9. Experiencia de uso","blocks":[{"type":"item","state":"✅","text":"Panel de salud (e.firma y su caducidad, correo, respaldos, vigilancia) y bitácora."},{"type":"item","state":"✅","text":"Botón «PROBAR TODO» (1.7.0, en Operaciones): autodiagnóstico en un clic con un semáforo por prueba — base de datos, correo configurado, listados al día, respaldo y copia externa recientes y caducidad de cada e.firma. La conexión con el SAT NO se prueba a propósito: la disciplina 5002 prohíbe gastar solicitudes en diagnósticos."},{"type":"item","state":"✅","text":"Bitácora de movimientos del sistema. ✅ CLICABLE (1.6.11): cada entrada abre el objeto al que se refiere (el CFDI de una cancelación, el SAT, los respaldos, el archivo). ✅ Filtros por tipo y texto, RESUMEN DE ACTIVIDAD por día y semana y exportación CSV (1.7.0, en Operaciones); ✅ registro de accesos del invitado y de su configuración (1.7.0, en Ajustes)."},{"type":"item","state":"✅","text":"Semáforos verde/ámbar/rojo en todo el sistema, con fila de semáforos abriendo el Resumen (1.6.11)."},{"type":"item","state":"✅","text":"Sonidos discretos configurables por evento (éxito, aviso, alerta, error) con interruptor general y elección por evento en Ajustes (cableados en 1.6.11)."},{"type":"item","state":"✅","text":"Click para abrir: cada tarjeta, fila, gráfico, periodo de cobertura y contraparte abre su documento o expediente (1.6.11)."},{"type":"item","state":"✅","text":"Acciones directas en tarjetas CFDI (ver, descargar XML, abrir PDF, copiar UUID, imprimir) y arrastrar y soltar para importar en cualquier pantalla; «Descargar ahora» por RFC; buscador global que también ejecuta acciones (1.6.11)."},{"type":"item","state":"✅","text":"PacoSAT instalable en el móvil (PWA) (1.7.0): manifiesto, icono y service worker que guarda la portada para abrir sin red; las pantallas ya eran adaptativas y la navegación funciona en pantallas pequeñas."},{"type":"item","state":"✅","text":"MODO OFFLINE (1.7.0): la app abre sin conexión (portada en caché) y la pantalla «Sin conexión» consulta la copia local CIFRADA (AES-GCM con clave del dispositivo) y de solo lectura de los ÚLTIMOS 3 MESES (CFDI con su desglose, saldos por cobrar/pagar, facturas esperadas, antigüedad de listados y posición bancaria), siempre con el sello «estás viendo datos de las HH:MM». Los informes clave de esos 3 meses (resumen mensual e IVA estimado) se pregeneran en el servidor dentro del paquete sin conexión; la copia se refresca pulsando «Sincronizar ahora la copia sin conexión» en la pantalla «Sin conexión». Lo que no puede salir (la descarga de un RFC) queda EN COLA como intención y se ejecuta una sola vez al volver la conexión. El XML/PDF individual se abre offline si quedó en la caché reciente; el archivo histórico completo vive en el NAS."},{"type":"item","state":"✅","text":"Acceso en casa sin internet (1.7.0): el mismo proxy del NAS puede servir un nombre local (o la IP) con idéntica autenticación — el procedimiento quedó documentado en DESPLIEGUE.md; sin red en absoluto, manda la copia sin conexión."},{"type":"item","state":"✅","text":"Preguntas en lenguaje normal sobre los propios datos, calculadas 100 % en local (1.7.0, pantalla «Preguntas»): cuánto me deben, cuánto debo, el IVA estimado de un mes, qué vence esta semana y totales por RFC/periodo. Sin salir del dispositivo."},{"type":"item","state":"✅","text":"Escala (1.7.0, mejora nº 10): sincronización por diferencias con revisión por registro y lápidas de borrado (la app solo copia lo que cambió), paginación del archivo de facturas (desde la 1.6.11) y cobertura calculada sobre índices en memoria."},{"type":"item","state":"✅","text":"Sello en el pie: «PacoSAT {versión} · Modificado el {fecha} a las {hora} · Creado por Paco Iglesias» (la fecha de modificación la aporta el servidor y se omite en modo local sin servidor); en Ajustes, los mismos datos como ficha (versión, autor, creación y última modificación de la copia)."}]},{"title":"9 bis. Principios de experiencia (regla de diseño de Paco)","blocks":[{"type":"item","state":"✅","text":"INTUITIVO (aplicado en 1.6.11 y revisado en la 1.7.0): lenguaje llano; cada término del SAT explicado en una línea; botones con v async function cloudWrite(batch, replace) {
  const data = { ...batch };
  if (batch.files) data.files = await Promise.all(batch.files.map(async file => ({
    id: file.id, mime: file.blob.type, content: encode64(bytes(await file.blob.arrayBuffer()))
  })));
  await satApi('storage', { batch: data, replace });
  for (const store of Object.keys(batch)) cloudMarks.delete(store);
}
function pdfLinks(doc, blob) {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(blob);
  const link = n('a', 'Abrir PDF en otra pestaña ↗');
  link.href = previewUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
  const buttons = n('div', undefined, 'actions');
  buttons.append(link, action('Descargar original', () => download(blob, doc.name), undefined, 'down'));
  return buttons;
}
async function viewPdf(doc) {

async function importInvoicePdf(file) {
  await requireStorage();
  check(people.length, 'Agrega un contribuyente antes de importar una factura PDF.');
  check(await pdfOk(file), 'Elige un PDF válido de hasta 15 MB.');
  let result = { uuids: [], rfcs: [], hasText: false }, failure = '';
  if (satToken) {
    announce('Leyendo folios fiscales en el PDF…');
    try { result = await satApi('pdf-analyze', { data: encode64(bytes(await file.arrayBuffer())) }); }
    catch (error) { failure = error.message; }
  }
  const candidates = Array.isArray(result.uuids) ? result.uuids : [];
  const known = Array.isArray(result.rfcs) ? result.rfcs : [];
  const automatic = candidates.length === 1 ? candidates[0] : '';
  const match = invoices.find(row => row.id === automatic);
  const belongs = candidate => !match || [match.from.rfc, match.to.rfc].includes(candidate);
  const applicable = people.filter(person => belongs(person.id));
  check(applicable.length, 'El XML vinculado pertenece a otro expediente.');
  const suitable = applicable.filter(p => known.includes(p.id));
  const options = [['', 'Selecciona un RFC'], ...applicable.map(p => [p.id, p.name + ' · ' + p.id])];
  const taxpayer = select(options, scope && applicable.some(p => p.id === scope) ? scope :
    suitable.length === 1 ? suitable[0].id : applicable.length === 1 ? applicable[0].id : '');
  taxpayer.required = true;
  const issueDate = input('date', { value: match?.date.slice(0, 10) || '', required: true });
  const folio = input('text', { value: automatic, maxLength: 36, placeholder: 'UUID del CFDI, si está disponible' });
  if (scope && ((match && !belongs(scope)) || (!match && known.length && !known.includes(scope)))) {
    announce('El PDF no corresponde al RFC seleccionado ' + scope + '. RFC detectados: ' + (known.join(', ') || [match.from.rfc, match.to.rfc].join(', ')), true);
    return viewPdfFile(file);
  }
  const note = failure || (automatic ? match ? 'Encontré el XML del mismo UUID. Revisa los datos para vincular la representación impresa.' :
    'Detecté un UUID. El PDF se vinculará cuando exista el XML correspondiente.' :
    candidates.length ? 'El PDF contiene varios UUID. Escribe el folio correcto para vincularlo.' :
    'No pude identificar un UUID. Si es un escaneo, captura el folio manualmente o guarda el PDF sin vincular.');
  reportPdfState(note);
  dialog('Archivar factura PDF', [cell(file.name, note), field('Expediente', taxpayer),
    field('Fecha del comprobante', issueDate), field('UUID (opcional)', folio)], async () => {
    const uuid = folio.value.trim().toUpperCase();
    check(!uuid || UUID.test(uuid), 'El UUID debe tener 36 caracteres en formato de folio fiscal.');
    const linked = invoices.find(row => row.id === uuid);
    check(!linked || [linked.from.rfc, linked.to.rfc].includes(taxpayer.value), 'El XML de ese UUID corresponde a otro RFC.');
    check(!known.length || linked || known.includes(taxpayer.value), 'El RFC seleccionado no aparece en el PDF.');
    check(!uuid || !documents.some(doc => doc.kind === 'Factura PDF' && doc.rfc === taxpayer.value && doc.uuid === uuid),
      'Ese UUID ya tiene una factura PDF en este expediente.');
    const id = 'pdf:' + crypto.randomUUID();
    const row = { id, rfc: taxpayer.value, kind: 'Factura PDF', date: issueDate.value,
      period: '', name: file.name.slice(0, 180), uuid };
    await writeBatch({ documents: [row], files: [{ id, blob: new Blob([file], { type: 'application/pdf' }) }] });
    docFilter = 'Factura PDF';
    if (scope && scope !== taxpayer.value) scope = taxpayer.value;
    await refresh(); navigate('docs');
    announce(linked ? 'PDF archivado y vinculado al XML.' : 'Factura PDF archivada.');
  });
}

function linkPdfDialog(doc) {
  const uuid = input('text', { required: true, maxLength: 36, value: doc.uuid || '', placeholder: 'UUID del XML importado' });
  dialog('Vincular PDF a su CFDI', [n('p', doc.name + ' · ' + doc.rfc), field('Folio fiscal', uuid)], async () => {
    const id = uuid.value.trim().toUpperCase();
    const row = invoices.find(item => item.id === id);
    check(UUID.test(id) && row, 'Importa primero el XML de ese UUID.');
    check([row.from.rfc,row.to.rfc].includes(doc.rfc), 'El XML corresponde a otro RFC.');
    check(!documents.some(d => d.id !== doc.id && d.rfc === doc.rfc && d.uuid === id && d.kind === 'Factura PDF'), 'Ese CFDI ya tiene un PDF vinculado.');
    await writeBatch({ documents: [{ ...doc, uuid: id }] });
    await refresh();
    await logEvent('PDF vinculado al CFDI ' + id);
    announce('PDF vinculado al XML.');
  });
}

async function addPerson() {
  await requireStorage();
  const name = input('text', { required: true, maxLength: 120, placeholder: 'Nombre o razón social' });
  const id = input('text', { required: true, maxLength: 13, placeholder: 'RFC de 12 o 13 caracteres' });
  const note = n('p', '', 'rfc-note');
  const confirmDigit = input('checkbox');
  const confirmField = field('Guardar aunque el dígito verificador no cuadre', confirmDigit);
  confirmField.hidden = true;
  const hint = 'Al escribir se revisan la estructura, la fecha y el dígito verificador oficial. ' +
    'La revisión es de forma: no confirma que el RFC exista en el SAT.';
  const paint = () => {
    const result = validateRfc(id.value);
    confirmField.hidden = !(result.level === 'digit' && !result.generic);
    if (!id.value.trim()) { note.dataset.state = 'info'; note.textContent = hint; }
    else if (result.level === 'structure') { note.dataset.state = 'error'; note.textContent = result.error; }
    else if (result.generic) {
      note.dataset.state = 'info';
      note.textContent = 'Es uno de los RFC genéricos del SAT (público en general u operaciones con extranjeros): ' +
        'se acepta con esta nota y no se le exige el dígito verificador.';
    } else if (result.level === 'digit') {
      note.dataset.state = 'warn';
      note.textContent = 'El dígito verificador no cuadra: para esta base debería ser «' + result.digitExpected + '» y trae «' +
        result.rfc.slice(-1) + '». Casi siempre es una errata al teclear. Revisa el RFC y, solo si estás seguro de que así consta, ' +
        'marca la casilla para guardarlo de todos modos.';
    } else {
      note.dataset.state = 'ok';
      note.textContent = 'Válido en forma: estructura, fecha y dígito verificador correctos (' +
        (result.type === 'fisica' ? 'persona física' : 'persona moral') + '). Esto no confirma que el RFC exista en el SAT.';
    }
    return result;
  };
  id.oninput = () => { confirmDigit.checked = false; paint(); };
  dialog('Agregar contribuyente', [field('Nombre o razón social', name), field('RFC', id), note, confirmField], async () => {
    const rfc = id.value.trim().toUpperCase(), label = name.value.trim();
    check(label, 'Escribe un nombre o razón social.');
    const result = validateRfc(rfc);
    check(result.level !== 'structure', result.error);
    check(result.generic || result.level !== 'digit' || confirmDigit.checked,
      'El dígito verificador no cuadra (debería ser «' + result.digitExpected + '»). Corrige el RFC o marca la casilla «Guardar aunque el dígito verificador no cuadre».');
    check(!await readStore('people', rfc), 'Ese RFC ya está en tu cartera.');
    await writeBatch({ people: [{ id: rfc, name: label }] });
    scope = rfc;
    await refresh(); announce('Expediente creado para ' + rfc + '.');
    /* Siguiente paso visible (UX-24): el alta no termina en el Resumen
       sin guía; se ofrecen las dos acciones naturales del expediente.
       Se difiere un instante porque el propio diálogo del alta se está
       cerrando al terminar este envío. */
    setTimeout(() => {
      const next = n('div', undefined, 'actions');
      next.append(action('Importar sus XML/ZIP', () => { $('dialog').close(); chooseImport(); }, 'primary', 'up'),
        action('Autorizar su e.firma', () => { $('dialog').close(); if (typeof unlockDialog === 'function') unlockDialog(rfc); }, undefined, 'lock'));
      dialog('Expediente creado · ' + rfc, [n('p', '¿Qué sigue? Importa los XML que ya tengas de este RFC o autoriza su e.firma para que PacoSAT descargue solo.'), next]);
    }, 80);
  }, 'Agregar contribuyente');
  paint();
}

async function importBatch(source, requiredRfc = scope, { quiet = false, fromFolder = false } = {}) {
  if (importing) return;
  try { await requireStorage(); }
  catch (error) { if (quiet) throw error; announce(error.message, true); return; }
  /* Modo carpeta (1.7.4, pieza 1): la estructura tipo OneFacture
     (Emitidos/Recibidos/año/mes) entra por el MISMO pipeline; lo que no
     es XML/ZIP no se descarta en silencio: se anota como «no procesado»
     con su motivo y sale en el resumen fijo. */
  const allFiles = [...source];
  const files = allFiles.filter(file => /\.(xml|zip)$/i.test(file.name));
  const skipped = fromFolder
    ? allFiles.filter(file => !/\.(xml|zip)$/i.test(file.name)).slice(0, 20)
        .map(file => ({ name: file.name.slice(0, 180), reason: 'No es un XML ni un ZIP de CFDI: no se procesó.' }))
    : [];
  if (!files.length) return announce(fromFolder && skipped.length
    ? 'La carpeta no trae XML ni ZIP de CFDI (' + skipped.length + ' archivos de otro tipo, sin procesar).'
    : 'Elige archivos .xml o .zip con CFDI.', true);
  if (!people.length) return announce('Agrega primero los RFC que quieres importar.', true);
  importing = true;
  $('primary').disabled = true;
  /* Indicador global persistente: contador real por entradas (los ZIP
     suman sus entradas al total en cuanto se abre su directorio). */
  let totalUnits = files.length, doneUnits = 0;
  if (!quiet) activityStart(fromFolder ? 'Importando carpeta de comprobantes' : 'Importando comprobantes', totalUnits);
  let added = 0, duplicates = 0, review = 0, scopeRejected = 0;
  let nuevosEmitidos = 0, nuevosRecibidos = 0;
  const nuevosPorMes = new Map();
  const dupIds = [];
  const issues = [];
  const pending = new Map();
  const known = scopes();
  const seen = new Set((await readStore('invoices').catch(() => invoices)).map(row => row.id));
  let pendingSize = 0;
  const issue = (name, error) => {
    review++;
    if (issues.length < 20) issues.push({ name: name.slice(0, 180), reason: error.message.slice(0, 320) });
  };
  async function flush() {
    if (!pending.size) return;
    await writeBatch({ invoices: [...pending.values()].map(item => item.row), files: [...pending.values()].map(item => item.file) });
    added += pending.size;
    pending.clear();
    pendingSize = 0;
  }
  async function accept(name, xml) {
    let row;
    try {
      row = withFiscal(parseXml(xml), xml);
      check(!requiredRfc || row.from.rfc === requiredRfc || row.to.rfc === requiredRfc,
        'No corresponde a ' + requiredRfc + '. Emisor ' + row.from.rfc + ' · Receptor ' + row.to.rfc + '.');
      check(known.has(row.from.rfc) || known.has(row.to.rfc), 'Los RFC del comprobante no están registrados.');
    } catch (error) {
      /* UX-03: si hay un RFC seleccionado, avisar cuántos archivos se
         fueron a revisión SOLO por el alcance, para que no parezca que
         «desaparecieron» facturas de otros RFC. */
      if (String(error.message).startsWith('No corresponde a')) scopeRejected++;
      issue(name, error); return;
    }
    if (seen.has(row.id)) { duplicates++; if (dupIds.length < 50) dupIds.push(row.id); return; }
    seen.add(row.id);
    /* Desglose del resumen fijo: dirección y mes de cada nuevo. */
    if (known.has(row.from.rfc)) nuevosEmitidos++; else if (known.has(row.to.rfc)) nuevosRecibidos++;
    const monthKey = String(row.date || '').slice(0, 7);
    if (/^\d{4}-\d{2}$/.test(monthKey)) nuevosPorMes.set(monthKey, (nuevosPorMes.get(monthKey) || 0) + 1);
    pending.set(row.id, { row, file: { id: 'xml:' + row.id, blob: new Blob([xml], { type: 'application/xml' }) } });
    pendingSize += xml.length;
    if (pending.size >= 100 || pendingSize >= 12 * MB) await flush();
  }
  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (!quiet) announce('Importando ' + (i + 1) + ' de ' + files.length + ' · ' + file.name);
      if (/\.xml$/i.test(file.name)) {
        if (file.size > 8 * MB) { issue(file.name, new Error('El XML supera 8 MB.')); doneUnits++; if (!quiet) activityProgress(doneUnits, file.name); continue; }
        let xml;
        try { xml = bytes(await file.arrayBuffer()); }
        catch (error) { issue(file.name, error); doneUnits++; if (!quiet) activityProgress(doneUnits, file.name); continue; }
        await accept(file.name, xml);
        doneUnits++;

          try { entry = await zip.next(); }
          catch (error) { issue(file.name, error); break; }
          if (!expanded && meta.total) {

            totalUnits += meta.total - 1;
            if (!quiet) activitySetTotal(totalUnits);
          }
          if (entry.done) {
            if (!count) issue(file.name, new Error('El ZIP no contiene CFDI XML.'));

          count++;
          await accept(entry.value.name, entry.value.xml);
          doneUnits++;
          if (!quiet) activityProgress(doneUnits, file.name + ' · ' + entry.value.name);

        if (expanded && count < meta.total) {

          doneUnits += meta.total - count;

      announce(added + ' nuevos · ' + duplicates + ' duplicados · ' + review + ' por revisar' +

        (issues.length ? '\n' + issues.slice(0, 6).map(item => item.name + ' · ' + item.reason).join('\n') : ''), Boolean(review));

         problemas o con archivos sin procesar, el resultado queda en
         pantalla hasta que el usuario lo cierra — nada de avisos

function requestDialog(preset) {
  const person = selectPerson();
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Mexico_City', year: 'numeric', month: '2-digit', day: '2-digit' }).format();
  const start = input('date', { max: today, value: today.slice(0, 8) + '01', required: true });
  const end = input('date', { max: today, value: today, required: true });
  const direction = select([['received', 'Recibidos'], ['issued', 'Emitidos']], 'received');
  /* Preselección (UX-05): desde un hueco de Cobertura el diálogo nace
     con el RFC, el sentido y los extremos exactos del hueco. */
  if (preset) {
    if (preset.rfc) person.value = preset.rfc;
    if (preset.direction) direction.value = preset.direction;
    if (preset.start) start.value = preset.start;
    if (preset.end) end.value = preset.end;
  }
  const type = select([['cfdi', 'CFDI (XML completos)'], ['metadata', 'Metadatos (registros ligeros, para reconciliar)']], 'cfdi');
  if (preset?.type) type.value = preset.type;
  /* Periodos frecuentes en un clic (1.6.10): sin teclear fechas. */
  const quick = n('div', undefined, 'actions');
  const fmt = date => date.toISOString().slice(0, 10);
  const setRange = (from, to) => { start.value = fmt(from); end.value = fmt(to); refreshPlan(); };
  const nowDate = new Date(today + 'T12:00:00');
  quick.append(
    action('Mes pasado', () => setRange(new Date(nowDate.getFullYear(), nowDate.getMonth() - 1, 1), new Date(nowDate.getFullYear(), nowDate.getMonth(), 0))),
    action('Este trimestre', () => setRange(new Date(nowDate.getFullYear(), Math.floor(nowDate.getMonth() / 3) * 3, 1), nowDate)),
    action('Este año', () => setRange(new Date(nowDate.getFullYear(), 0, 1), nowDate)),
    action('Últimos 30 días', () => setRange(new Date(nowDate.getTime() - 29 * 86400000), nowDate)));
  /* Planificador anti-5002: antes de gastar una solicitud, el servidor
     cruza el criterio exacto contra el libro y avisa aquí mismo. Si ya
     se pidió, la vía es la variante de cierre +1 s (nunca el duplicado);
     si el rango CFDI es amplio y nuevo, propone explorar primero con
     Metadatos. Es una lectura: no envía nada por sí solo. */
  const planNote = n('p', 'Revisando el criterio en el libro…', 'plan-note');
  const metaFirst = action('Pedir este rango como Metadatos', () => { type.value = 'metadata'; refreshPlan(); });
  metaFirst.hidden = true;
  const planBox = n('div', undefined, 'plan-box');
  planBox.append(planNote, metaFirst);
  let planSeq = 0;
  async function refreshPlan() {
    const seq = ++planSeq;
    try {
      const plan = await satApi('plan', { rfc: person.value, direction: direction.value, type: type.value, start: start.value, end: end.value });
      if (seq !== planSeq) return;
      planNote.textContent = plan.reason;
      metaFirst.hidden = plan.recommendation !== 'metadata-first';
    } catch {
      if (seq !== planSeq) return;
      planNote.textContent = 'El planificador no pudo revisar el libro; la guardia actuará al enviar, como siempre.';
      metaFirst.hidden = true;
    }
  }
  for (const control of [person, direction, type, start, end]) control.addEventListener('change', refreshPlan);
  refreshPlan();
  dialog('Solicitar un periodo al SAT', [field('Contribuyente', person), field('Comprobantes', direction),
    field('Tipo de solicitud', type), field('Planificador 5002', planBox), field('Periodo frecuente', quick),
    field('Fecha inicial', start), field('Fecha final', end)], async () => {
    const payload = { rfc: person.value, direction: direction.value, start: start.value, end: end.value, type: type.value };
    /* Desde el Libro, «Pedir con cierre +1 s» nace ya con la variante. */
    if (preset?.shiftEnd) payload.shiftEnd = 1;
    for (;;) {
      try { satData = await satApi('request', payload); break; }
      catch (error) {
        if (!error.guard) throw error;
        const choice = await guardChoice(error.guard);
        if (choice === 'cancel') {
          $('dialog').close();
          announce('Solicitud no enviada. ' + error.guard.message, true);
          return;
        }
        if (choice === 'rescue') {
          $('dialog').close();
          rescueDialog(error.guard);
          return;
        }
        /* Cada vuelta suma un segundo al cierre: si esa variante
           también estaba usada, la siguiente guardia ofrece el
           segundo siguiente. Nunca se repite un criterio. */
        payload.shiftEnd = (payload.shiftEnd || 0) + 1;
      }
    }
    fillSat(); announce('Solicitud enviada. PacoSAT revisará cuándo libera el paquete el SAT.');
  }, 'Enviar solicitud');
}

async function pollSat() {
  if (!satToken || !ready || satPolling) return;
  satPolling = true;
  try {
    satData = await satApi('status');
    satError = '';
    flushOfflineQueue().catch(() => {});
    if (satData.settings) {
      /* La identidad del servidor manda sobre la copia local (1.6.6). */
      appSettings = { ...appSettings, ...satData.settings, logoData: appSettings.logoData };
      if (satData.settings.hasLogo && !appSettings.logoData) {
        try {
          const logo = await satApi('settings/logo');
          appSettings.logoData = 'data:' + logo.mime + ';base64,' + logo.data;
        } catch { /* sin logo disponible: se queda la marca de texto */ }
      }
      if (!satData.settings.hasLogo) appSettings.logoData = '';
      applySettings();
    }
    if (cloudStorage && satData.cloudRevision !== cloudRevision && !$('dialog').open && !importing &&
        !document.activeElement?.matches('input,select,textarea')) {
      await refresh(page === 'sat');
      cloudRevision = satData.cloudRevision;
    }
    const drain = async () => {
      for (const packet of satData.inbox) {
        if (importing || !people.some(person => person.id === packet.rfc)) continue;
        const archive = await satApi('packages/' + packet.id);
        if (importing || $('dialog').open) break;
        const result = await importBatch([new File([archive], 'SAT-' + packet.rfc + '-' + packet.id + '.zip')], packet.rfc, { quiet: true });
        if (result) { if (result.added) soundCue('notice'); await satApi('packages/' + packet.id, { imported: result.added }); }
      }
    };
    if (!$('dialog').open) {
      if (navigator.locks) await navigator.locks.request('pacosat-sat-import', { ifAvailable: true }, lock => lock ? drain() : undefined);
      else await drain();
    }
  } catch (error) {
    satError = error.message;
  } finally {
    satPolling = false;
    /* La insignia del Centro de Avisos se refresca con el mismo pulso
       del servidor (1.7.4): sin peticiones extra fuera de este ciclo. */
    refreshAvisos().catch(() => {});
    if (page === 'sat' && !$('dialog').open && !document.activeElement?.closest('#sat-live')) fillSat();
  }
}
if (satToken) {
  startup.then(pollSat);
  setInterval(pollSat, 15000);
}

/* ===== Vigilancia SAT (rediseño 1.7.4, a petición de Paco) =====
   Antes: un muro de UUID con «Sin consulta · Consulta pendiente de

   abre con lo que Paco quiere hacer y con el resumen en tarjetas:

   fechas, «Revisar mis CFDI ahora», «Actualizar listados 69-B y 69»),
   seis tarjetas con semáforo y números grandes, la verdad de la
   revisión automática («X de N revisados · última tanda…») y, debajo,
   la lista ya secundaria: buscable por empresa, RFC o mes, con el
   estado en palabras llanas y qué hacer (o «no tienes que hacer
   nada»). El UUID solo se ve al abrir el detalle del comprobante. */
const watched = new Set();

let monitorData = { fetched: null, error: '' }, monitorError = '', monitoring = false;
let monitorFilter = 'attention', monitorCursor = 0;
let monitorSummary = null, monitorSummaryKey = '';
let monitorSearch = '', monitorDlStart = '', monitorDlEnd = '', monitorDlDirection = 'received';
const monitorRow = row => ({
  id: row.id, emitter: row.from.rfc, receiver: row.to.rfc, total: row.total,
  seal: /^[A-Za-z0-9+/=]{8}$/.test(row.seal || '') ? row.seal : ''
});
/* El estado de un CFDI en lenguaje de Paco: insignia corta, frase que
   lo explica y si hay que hacer algo. Nada de códigos del SAT en
   crudo ni de «pendiente de reintento». */
function monitorErrorText(error) {
  if (/timeout|aborted|AbortError/i.test(error)) return 'El servicio del SAT tardó demasiado en responder. Se volverá a intentar solo; no tienes que hacer nada.';
  if (/HTTP \d{3}/.test(error)) return 'El servicio del SAT respondió con un error. Se volverá a intentar solo; no tienes que hacer nada.';
  if (/fetch|network|conexi|red\b/i.test(error)) return 'No hubo conexión con el servicio del SAT. Se volverá a intentar solo; no tienes que hacer nada.';
  return 'Hubo un problema al consultar el SAT. Se volverá a intentar solo; no tienes que hacer nada.';
}
function monitorStateInfo(row) {
  const item = fiscalResults.get(row.id);
  if (item?.efos?.length) return { badge: 'En el listado 69-B', state: '69-B',
    text: item.efos.includes('Definitivo') ?
      'El SAT confirmó operaciones inexistentes de este RFC: esos CFDI no deben deducirse. Avisa a tu contadora.' :
      'El SAT presume operaciones inexistentes de este RFC: pide aclaración al emisor y avisa a tu contadora antes de deducir.' };
  if (item?.sat?.state === 'Vigente') return { badge: 'Vigente', state: 'Vigente',
    text: 'El SAT lo confirma vigente.' + (item.checked ? ' Revisado el ' + localDateTime(item.checked) + '.' : '') };
  if (item?.sat?.state === 'Cancelado') return { badge: 'Cancelado', state: 'Cancelado',
    text: 'El SAT lo marca cancelado' + (item.sat.cancellation ? ' (' + item.sat.cancellation + ')' : '') +
      '. Si ya lo pagaste o lo dedujiste, avisa a tu contadora.' };
  if (item?.sat?.state === 'No encontrado') return { badge: 'No localizado', state: 'No encontrado',
    text: 'El SAT no lo localiza con los datos del comprobante. Pasa con comprobantes muy antiguos o cuando el servicio del SAT no lo tiene a mano: no es un error tuyo y no hay nada que hacer.' };
  if (item?.sat?.state === 'Formato rechazado') return { badge: 'Formato rechazado', state: 'Formato rechazado',
    text: 'El SAT rechazó el formato de la consulta (respuesta N-601), no el comprobante: desde la 1.9.0 la expresión impresa se normaliza antes de consultar (total sin ceros sobrantes, folio en mayúsculas) y se volverá a revisar al mes. No significa que el CFDI no exista ni que esté cancelado.' };
  if (item?.sat) return { badge: item.sat.state, state: item.sat.state, text: 'El SAT respondió: ' + item.sat.state + '.' };
  if (item?.error) return { badge: 'No se pudo consultar', state: 'Error', text: monitorErrorText(item.error) };
  return { badge: 'Sin revisar todavía', state: 'Sin consulta',
    text: 'Está en la cola de la revisión automática, que avanza por tandas. No tienes que hacer nada.' };

function donutSegments(counts) {
  const order = [['vigente', 'Vigentes'], ['cancelado', 'Cancelados'], ['efos', 'Con 69-B'], ['sin', 'Sin consulta']];
  const total = order.reduce((sum, [key]) => sum + (counts[key] || 0), 0);
  let acc = 0;
  return order.map(([key, label]) => {
    const value = counts[key] || 0;
    const frac = total ? value / total : 0;
    const segment = { key, label, value, frac, start: acc };
    acc += frac;
    return segment;
  });
}

async function monitorCheckNow() {
  const selection = invoices.filter(matches);
  const pending = selection.filter(row => !fiscalResults.get(row.id)?.sat);
  if (!pending.length) { announce('No hay comprobantes pendientes de revisar: todos tienen ya su estado del SAT.'); return; }
  activityStart('Revisando el estado de tus CFDI en el SAT', pending.length);
  try {
    const fresh = pending.filter(row => !watched.has(row.id)).map(monitorRow);
    for (let i = 0; i < fresh.length; i += 150) {
      const chunk = fresh.slice(i, i + 150);
      await satApi('monitor', { records: chunk, ids: [] });
      for (const row of chunk) watched.add(row.id);
    }
    let done = 0, guard = 0;
    for (;;) {
      const result = await satApi('monitor/check-now', { ids: pending.map(row => row.id) });
      done += result.processed || 0;
      activityProgress(Math.min(done, pending.length),
        result.remaining ? 'Quedan ' + number.format(result.remaining) + ' en la cola del vigilante.' : '');
      if (!result.remaining || !result.processed) break;
      if (++guard > 400) break;

    await loadMonitorSummary(true);

      'Ya tienen estado del SAT ' + number.format(counts?.revisados || 0) + ' de ' + number.format(counts?.total || selection.length) + ' comprobantes.',
      (counts?.sinRevisar || counts?.conProblema) ?

        ' sin respuesta: la revisión automática seguirá intentándolo y también puedes repetir este botón más tarde.' :
        'No queda ningún comprobante sin revisar.'

    activityFail('La revisión se detuvo', 'Pasó esto: ' + error.message + ' Lo ya revisado quedó guardado; puedes repetir el botón cuando quieras.');

async function pollMonitor() {
  if (!satToken || !ready || monitoring) return;
  monitoring = true;
  try {
    const records = invoices.filter(row => !watched.has(row.id)).slice(0, 125).map(monitorRow);
    const all = invoices.filter(matches);
    if (monitorCursor >= all.length) monitorCursor = 0;
    const candidates = page === 'invoices' ? invoiceRows().slice(invoicePage * 35, (invoicePage + 1) * 35) : all.slice(monitorCursor, monitorCursor + 500);
    const result = await satApi('monitor', { records, ids: candidates.map(row => row.id) });
    for (const row of records) watched.add(row.id);
    for (const entry of result.results) fiscalResults.set(entry.id, entry);
    let cancellationsLogged = 0;
    for (const entry of result.results) {
      if (cancellationsLogged >= 5 || entry.sat?.state !== 'Cancelado') continue;
      const text = 'Cancelación detectada · ' + entry.id;
      if (activity.some(row => row.event === text)) continue;
      await logEvent(text);
      soundCue('alert');
      cancellationsLogged++;
    }
    if (page !== 'invoices') monitorCursor += 500;
    monitorData = result;
    monitorError = '';
    if (page === 'monitor') await loadMonitorSummary();
  } catch (error) { monitorError = error.message; }
  finally {
    monitoring = false;
    if (page === 'monitor' && !$('dialog').open && !document.activeElement?.matches('input,select,textarea')) render();
    if (page === 'invoices' && !$('dialog').open && !document.activeElement?.closest('button,input,select,textarea')) render();
  }
}

  for (const rfc of rfcs) screens.push(coverageHeatmap(rfc, coverage.days[rfc] || { received: [], issued: [] }));

}
function coverageHeatmap(rfc, daysForRfc) {
  const wrap = panel('Mapa anual de días cubiertos · ' + rfc);
  const received = new Set(daysForRfc.received || []), issued = new Set(daysForRfc.issued || []);
  const years = [...new Set([...received, ...issued].map(date => date.slice(0, 4)))].sort();
  const year = years.includes(coverageYear) ? coverageYear : (years.length ? years[years.length - 1] : String(new Date().getFullYear()));
  if (years.length > 1) {
    const picker = n('div', undefined, 'actions');
    const select = n('select');
    for (const option of years) { const node = n('option', option); node.value = option; select.append(node); }
    select.value = year;
    select.onchange = () => { coverageYear = select.value; render(); };
    picker.append(n('label', 'Año'), select);
    wrap.append(picker);
  }
  if (!received.size && !issued.size) {
    wrap.append(empty('Sin días cubiertos', 'Cuando una solicitud de este RFC termine, sus días se pintan aquí.'));
    return wrap;
  }
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const el = (tag, attrs, text) => {
    const node = document.createElementNS(NS, tag);
    for (const [name, value] of Object.entries(attrs || {})) node.setAttribute(name, value);
    if (text) node.textContent = text;
    return node;
  };
  const cell = 11, pitch = 14, top = 16;
  const jan1 = Date.UTC(Number(year), 0, 1);
  const firstSunday = jan1 - new Date(jan1).getUTCDay() * 86400000;
  const weeks = Math.ceil(((Date.UTC(Number(year), 11, 31) - firstSunday) / 86400000 + 1) / 7);
  svg.setAttribute('viewBox', '0 0 ' + (weeks * pitch + 2) + ' ' + (top + 7 * pitch));
  svg.setAttribute('class', 'hm'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Mapa de calor de días con descarga cubierta en ' + year + ' para ' + rfc);
  svg.append(el('title', {}, 'Días cubiertos en ' + year + ' · ' + rfc));
  const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  for (let month = 0; month < 12; month++) {
    const first = Date.UTC(Number(year), month, 1);
    const week = Math.floor((first - firstSunday) / (7 * 86400000));
    svg.append(el('text', { x: week * pitch + 1, y: 10 }, months[month]));
  }
  const detail = n('p', 'Toca un día del mapa para ver su detalle aquí.', 'hm-detail');
  for (let offset = 0; offset < 371; offset++) {
    const date = new Date(firstSunday + offset * 86400000);
    if (date.getUTCFullYear() !== Number(year)) continue;
    const key = date.toISOString().slice(0, 10);
    const level = (received.has(key) ? 1 : 0) + (issued.has(key) ? 1 : 0);
    const rect = el('rect', { x: Math.floor(offset / 7) * pitch + 1, y: top + (offset % 7) * pitch + 1,
      width: cell, height: cell, rx: 2, class: 'hm-l' + level });
    rect.append(el('title', {}, key + ' · recibidos: ' + (received.has(key) ? 'cubierto' : 'sin cubrir') +
      ' · emitidos: ' + (issued.has(key) ? 'cubierto' : 'sin cubrir')));
    /* El detalle por día también con tacto y teclado (UX-26), no solo
       con el tooltip del ratón. */
    rect.style.cursor = 'pointer';
    rect.addEventListener('click', () => {
      detail.textContent = dateLabel(key) + ' · recibidos: ' + (received.has(key) ? 'cubierto' : 'sin cubrir') +
        ' · emitidos: ' + (issued.has(key) ? 'cubierto' : 'sin cubrir');
    });
    svg.append(rect);
  }
  const scroll = n('div', undefined, 'hm-scroll'); scroll.append(svg);
  const legend = n('div', undefined, 'chart-legend');
  const item = (cls, label) => { const span = n('span'); span.append(n('i', undefined, cls), document.createTextNode(label)); return span; };
  legend.append(item('sw-hm0', 'Sin cubrir'), item('sw-hm1', 'Un sentido'), item('sw-hm2', 'Recibidos y emitidos'));
  wrap.append(scroll, legend, detail);
  return wrap;
}

async function saveAppSettings() {
  const name = $('settings-name')?.value ?? appSettings.installName;
  const sender = $('settings-sender')?.value ?? appSettings.senderName;
  const accent = document.querySelector('[data-accent-option][aria-pressed="true"]')?.dataset.accentOption ?? appSettings.accent;
  if (satToken) {
    const result = await satApi('settings', { installName: name, senderName: sender, accent });
    appSettings = { ...appSettings, ...result.settings, logoData: appSettings.logoData };
    if (pendingLogo === '') {
      await satApiDelete('settings/logo');
      appSettings.logoData = '';
      appSettings.hasLogo = false;
    } else if (pendingLogo) {
      const mime = /data:(.*?);/.exec(pendingLogo)[1];
      await satApi('settings/logo', { mime, data: pendingLogo.split(',')[1] });
      appSettings.logoData = pendingLogo;
      appSettings.hasLogo = true;
    }
    pendingLogo = undefined;
    announce('Ajustes guardados en el servidor.');
  } else {
    appSettings = { ...appSettings, installName: name.trim().slice(0, 60), senderName: sender.trim().slice(0, 60), accent,
      logoData: pendingLogo === '' ? '' : (pendingLogo || appSettings.logoData) };
    appSettings.hasLogo = Boolean(appSettings.logoData);
    try {
      localStorage.setItem('pacosat-settings', JSON.stringify({ installName: appSettings.installName,
        senderName: appSettings.senderName, accent: appSettings.accent, logoData: appSettings.logoData }));
    } catch { /* almacenamiento lleno o bloqueado: la identidad vale para esta sesión */ }
    pendingLogo = undefined;
    announce('Ajustes guardados en este navegador.');
  }
  applySettings();
  render();
}

  /* Fallo digno (ronda de correcciones, 9 nov 2026): si la descarga de
     hoy falla pero existe una última copia buena, la tarjeta lo dice
     así — con su fecha y sus registros — y el cruce sigue con esa
     copia. El error desnudo solo aparece si nunca hubo copia. */
  if (source.count > 0 && source.fetched) {
    if (source.error) return statusPill('warn', 'Última copia válida del ' +
      new Date(source.fetched).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }));
    if (Date.now() - source.fetched > 48 * 3600 * 1000) return statusPill('warn', 'Desactualizado');
    return statusPill('ok', 'Al día');
  }
  if (source.error) return statusPill('bad', 'Con error');
  if (!source.fetched) return statusPill('dim', source.manual ? 'Sin cargar' : 'Pendiente');
  if (Date.now() - source.fetched > 48 * 3600 * 1000) return statusPill('warn', 'Desactualizado');
  return statusPill('ok', 'Al día');
