/* PacoSAT 1.6.0 · Sistema de diseño: una sola capa de tokens para claro y oscuro.
   El tema manual vive en data-theme del documento; sin él manda prefers-color-scheme. */
:root{
  --ink:#17293f;--muted:#54687f;--border:#d9e3ee;--field-border:#bcccdc;--surface:#fff;--surface-2:#f3f7fb;--bg:#ecf1f7;
  --green:#0e6b4f;--green-hover:#0a5741;--on-accent:#fff;--tint:#e1f1e9;--focus:#1f7a6d;
  --nav:#0c1a2d;--nav-2:#12263f;--nav-text:#d9e8f7;--nav-muted:#93a9c4;--nav-field:#1a3353;--nav-border:#33507a;
  --nav-hover:#1a3353;--nav-active-bg:#14402f;--nav-active-ink:#a9ecc9;
  --logo-bg:linear-gradient(140deg,#e6f8ee,#8adbc3);--logo-ink:#143643;
  --danger:#a0281d;--danger-bg:#fae9e6;--warn-ink:#755015;--warn-bg:#fdf3d8;--ok-ink:#125d44;--ok-bg:#dcf2e7;
  --info-bg:#e8eef5;--info-ink:#435b74;--chip-bg:#eef3f9;--chip-ink:#375977;--guide-bg:#e9f3f6;
  --hero-1:#152c4e;--hero-2:#1e4a5f;--hero-ink:#fff;--hero-muted:#cfe5ee;--hero-kicker:#a7edda;
  --chart-received:#3d7ab8;--scroll:#b9c9da;--selection:#bfe3d2;--backdrop:#0d1b2e8c;--shadow-color:#12251d33;
  color-scheme:light;
}

  }
}

body{background:radial-gradient(ellipse at 85% 0%,var(--surface-2) 0,transparent 52%),var(--bg)}
.sidebar{background:linear-gradient(165deg,var(--nav-2) 0,var(--nav) 62%,var(--nav-2) 100%);border-right:1px solid var(--nav-border);padding:26px 18px}
.logo{background:var(--logo-bg);color:var(--logo-ink);box-shadow:0 8px 22px #0003}
.brand{font-size:22px}.brand small{color:var(--nav-muted)}
.sidebar nav button{padding:11px 10px}
.top{min-height:60px;border-color:var(--border);background:color-mix(in srgb,var(--surface) 92%,transparent)}
.badge{border:1px solid var(--ok-bg);color:var(--ok-ink)}
.heading{align-items:center}.heading h1{font-size:clamp(30px,4vw,48px)}.heading p{font-size:14px}
.top-tools{display:inline-flex;gap:6px;align-items:center}
.top-tools .icon-button{border-color:var(--border);background:var(--surface);color:var(--muted)}
.top-tools .icon-button[aria-pressed="true"]{color:var(--green);border-color:var(--green)}
.dashboard-hero{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:18px;padding:23px 27px;border-radius:17px;background:radial-gradient(ellipse at 92% 7%,#236a78 0,transparent 54%),linear-gradient(122deg,var(--hero-1),var(--hero-2));color:var(--hero-ink);box-shadow:0 12px 30px #1c3d632b}
.dashboard-hero h2{font-size:clamp(23px,3.1vw,34px);line-height:1.13;margin:5px 0 6px;overflow-wrap:anywhere}
.dashboard-hero p{color:var(--hero-muted)}
.hero-kicker{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--hero-kicker)}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px}
.hero-actions button{border-color:#7196a6;color:#f1fbff;background:#294d65}
.hero-actions button:hover{background:#356680}
.metric,.panel{border-radius:13px;box-shadow:0 2px 5px #2742640b}
.metric{padding:17px}.metric strong{font-size:30px}
.metric-label svg{box-sizing:content-box;padding:6px;border-radius:8px;background:var(--info-bg);color:var(--info-ink)}
.metric:nth-child(2) .metric-label svg{background:var(--ok-bg);color:var(--ok-ink)}
.metric:nth-child(3) .metric-label svg{background:var(--chip-bg);color:var(--chip-ink)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.panel-head{padding:16px 17px}.panel-head h2{font-size:18px}
.panel th{background:var(--surface-2)}.panel tbody tr:hover{background:var(--surface-2)}
.panel td:first-child{min-width:120px}
.guide{background:var(--guide-bg);border-color:var(--border)}
.filters{background:var(--surface)}.filters button{margin-left:auto}
.wide-dialog{width:min(990px,calc(100% - 24px));max-height:94vh}
.pdf-preview{display:block;width:100%;height:min(62vh,650px);background:var(--surface-2);border:1px solid var(--border);border-radius:9px}
.xml-view{background:var(--surface-2)}
.actions{flex-wrap:wrap}#form{max-height:inherit}.dialog-actions{position:sticky;bottom:0;background:var(--surface);padding-top:6px}
/* KPI del panel principal */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:15px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 2px 5px #2742640b;padding:15px 17px;display:grid;gap:4px;min-width:0}
.kpi-label{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;font-size:13px}
.kpi-label svg{color:var(--green)}
.kpi strong{font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.kpi.split strong{font-size:20px}
/* Gráfico SVG de totales por mes */
.chart-wrap{padding:6px 17px 14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .bar-issued{fill:var(--green)}
.chart .bar-received{fill:var(--chart-received)}
.chart .grid-line{stroke:var(--border);stroke-width:1}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 17px 14px;color:var(--muted);font-size:12.5px;font-weight:600}
.chart-legend span{display:inline-flex;gap:6px;align-items:center}
.chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart-legend .sw-issued{background:var(--green)}.chart-legend .sw-received{background:var(--chart-received)}
/* Reporte imprimible */
#print-report{display:none}
.report-head{border-bottom:3px solid var(--green);padding-bottom:10px;margin-bottom:14px}
.report-head h1{font-size:24px;margin:2px 0}
.report-meta{color:var(--muted);font-size:13px}
.report-note{font-size:12.5px;color:var(--muted);margin-top:12px}
@media print{
  .frame{display:none!important}
  #print-report{display:block!important;color:#000;background:#fff}
  #print-report table{width:100%;border-collapse:collapse}
  #print-report th,#print-report td{border:1px solid #bbb;padding:6px 8px;text-align:left;font-size:12.5px}
  #print-report .panel{border:none;box-shadow:none}
}

<script>'use strict';
const $ = id => document.getElementById(id);
const KB = 1024;
const MB = KB * KB;
const RFC = /^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/u;
const UUID = /^[A-F0-9]{8}(?:-[A-F0-9]{4}){3}-[A-F0-9]{12}$/;
// Validador completo de RFC (1.6.1). Comprueba estructura, fecha embebida y el
// dígito verificador oficial del SAT (Anexo III y procedimiento publicados por
// el SAT: el valor de cada carácter es su posición en RFC_CHAR_VALUES —
// 0-9 valen 0-9, A-N valen 10-23, & vale 24, O-Z valen 25-36, el espacio vale
// 37 y Ñ vale 38 —; se pondera de 13 a 2 sobre la base de 12 posiciones, ante-
// poniendo un espacio cuando la base es de 11, y la suma módulo 11 da el
// dígito: residuo 0 → «0», residuo 1 → «A», otro residuo → 11 menos residuo).
// Es una validación DE FORMA: no confirma que el RFC exista en el SAT.
const RFC_GENERICS = new Set(['XAXX010101000', 'XEXX010101000']);
const RFC_CHAR_VALUES = '0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ Ñ';
function rfcCheckDigit(base) {
  let body = String(base ?? '');
  if (body.length === 11) body = ' ' + body;
  if (body.length !== 12) return '';
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    const value = RFC_CHAR_VALUES.indexOf(body[i]);
    sum += (value < 0 ? 0 : value) * (13 - i);
  }
  const rest = sum % 11;
  if (!rest) return '0';
  const digit = 11 - rest;
  return digit === 10 ? 'A' : String(digit);
}
// Devuelve { rfc, type, generic, level, valid, digitExpected, digitOk, error }.
// level: 'structure' (error de estructura o de fecha, en error va el detalle),
// 'digit' (la forma es buena pero el dígito verificador no cuadra) o 'valid'.
// generic marca los RFC genéricos del SAT, que se aceptan con nota aunque su
// dígito no cuadre (XAXX010101000 no lo cumple por diseño).
function validateRfc(value) {
  const rfc = String(value ?? '').trim().toUpperCase();
  const result = { rfc, type: null, generic: RFC_GENERICS.has(rfc), level: 'structure', valid: false, digitExpected: null, digitOk: false, error: '' };
  const fail = message => { result.error = message; return result; };
  if (rfc.length !== 12 && rfc.length !== 13)
    return fail('El RFC debe tener 12 caracteres (persona moral) o 13 (persona física); este tiene ' + rfc.length + '.');
  const letters = rfc.length - 9;
  const letterPart = rfc.slice(0, letters), datePart = rfc.slice(letters, letters + 6),
    homoclave = rfc.slice(letters + 6, letters + 8), digit = rfc.slice(-1);
  if (!/^[A-ZÑ&]+$/.test(letterPart))
    return fail('Las ' + (letters === 4 ? 'cuatro' : 'tres') + ' primeras posiciones del RFC deben ser letras (se admiten Ñ y &).');
  if (!/^\d{6}$/.test(datePart))
    return fail('Después de las letras, el RFC lleva 6 dígitos con la fecha (año, mes y día).');
  const month = Number(datePart.slice(2, 4)), day = Number(datePart.slice(4, 6));
  const monthDays = [31, Number(datePart.slice(0, 2)) % 4 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if (month < 1 || month > 12)
    return fail('La fecha del RFC trae un mes imposible (' + datePart.slice(2, 4) + '): debe ir de 01 a 12.');
  if (day < 1 || day > monthDays[month - 1])
    return fail('La fecha del RFC trae un día imposible (' + datePart.slice(4, 6) + ' para el mes ' + datePart.slice(2, 4) + ').');
  if (!/^[A-Z0-9]{2}$/.test(homoclave))
    return fail('La homoclave (las dos posiciones antes del último carácter) debe ser alfanumérica.');
  if (!/^[0-9A]$/.test(digit))
    return fail('El último carácter del RFC es el dígito verificador: debe ser un número o la letra A.');
  result.type = letters === 4 ? 'fisica' : 'moral';
  result.level = 'digit';
  result.digitExpected = rfcCheckDigit(rfc.slice(0, -1));
  result.digitOk = result.digitExpected === digit;
  if (result.digitOk) { result.level = 'valid'; result.valid = true; }
  return result;
}
const KINDS = { I: 'Ingreso', E: 'Egreso', P: 'Pago', N: 'Nómina', T: 'Traslado' };
const DOCUMENTS = ['Factura PDF', 'Constancia / CIF', 'Opinión de cumplimiento', 'Declaración', 'Acuse', 'Otro documento'];
const STORES = ['people', 'invoices', 'documents', 'files', 'activity'];
let db;

function check(condition, message) { if (!condition) throw new Error(message); }
function bytes(value) { return new Uint8Array(value); }
function openDatabase(name = 'faro-fiscal-v2') {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(name, 1);
    request.onupgradeneeded = () => {
      for (const store of STORES) request.result.createObjectStore(store, { keyPath: 'id' });
    };
    request.onsuccess = () => {
      request.result.onversionchange = () => request.result.close();
      resolve(request.result);
    };
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Cierra otras ventanas de PacoSAT y vuelve a abrirlo.'));
  });
}
function readStore(store, key) {
  if (typeof cloudStorage !== 'undefined' && cloudStorage) return cloudRead(store, key);
  return new Promise((resolve, reject) => {
    const table = db.transaction(store).objectStore(store);
    const req = key === undefined ? table.getAll() : table.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function writeBatch(batch, replace = false) {
  if (typeof cloudStorage !== 'undefined' && cloudStorage) return cloudWrite(batch, replace);
  return new Promise((resolve, reject) => {
    const names = Object.keys(batch);
    const tx = db.transaction(names, 'readwrite');
    tx.oncomplete = resolve;
    tx.onabort = () => reject(tx.error || new Error('La operación se canceló.'));
    try {
      for (const name of names) {
        const table = tx.objectStore(name);
        if (replace) table.clear();
        for (const item of batch[name]) table.add(item);
      }
    } catch (error) {
      tx.abort();
      reject(error);
    }
  });
}
function decodeXml(raw) {
  const lead = new TextDecoder('windows-1252').decode(raw.subarray(0, 256));
  const declaration = lead.match(/^\s*<\?xml[^>]*encoding\s*=\s*["']([^"']+)/i);
  const encoding = raw[0] === 255 && raw[1] === 254 ? 'utf-16le' :
    raw[0] === 254 && raw[1] === 255 ? 'utf-16be' :
    raw[0] === 60 && raw[1] === 0 ? 'utf-16le' :
    raw[0] === 0 && raw[1] === 60 ? 'utf-16be' : declaration?.[1] || 'utf-8';
  return new TextDecoder(encoding, { fatal: true }).decode(raw);

function parseXml(raw, Parser = DOMParser) {
  check(raw.length && raw.length <= 8 * MB, 'XML vacío o mayor de 8 MB.');
  const xml = decodeXml(raw);
  check(!/<!DOCTYPE|<!ENTITY/i.test(xml), 'El XML contiene declaraciones no admitidas.');
  const doc = new Parser().parseFromString(xml, 'application/xml');
  const root = doc.documentElement;
  check(root.localName === 'Comprobante' && /^http:\/\/www\.sat\.gob\.mx\/cfd\/[34]$/.test(root.namespaceURI) &&
    !doc.getElementsByTagName('parsererror').length, 'No es un CFDI 3.x o 4.0 con estructura XML válida.');
  const elements = node => Array.from(node?.children || node?.childNodes || []).filter(item => item.nodeType === 1);
  const child = (node, name) => elements(node).find(item => item.localName === name && item.namespaceURI === root.namespaceURI);
  const attr = (node, key, fallback = key) => node?.getAttribute(key) || node?.getAttribute(fallback) || '';
  const party = item => ({ rfc: attr(item, 'Rfc', 'rfc').toUpperCase(), name: attr(item, 'Nombre', 'nombre').slice(0, 300) });
  const from = party(child(root, 'Emisor'));
  const to = party(child(root, 'Receptor'));

async function cloudRead(store, id) {
  const query = new URLSearchParams({ store });
  if (id !== undefined) query.set('id', id);
  const value = await satApi('storage?' + query);
  const decode = item => item && store === 'files' ? { id: item.id,
    blob: new Blob([decode64(item.content)], { type: item.mime }) } : item;
  return Array.isArray(value) ? value.map(decode) : decode(value);
}
async function cloudWrite(batch, replace) {

    id: file.id, mime: file.blob.type, content: encode64(bytes(await file.blob.arrayBuffer()))
  })));
  await satApi('storage', { batch: data, replace });

async function importInvoicePdf(file) {
  check(ready && people.length, 'Agrega un contribuyente antes de importar una factura PDF.');
  check(await pdfOk(file), 'Elige un PDF válido de hasta 15 MB.');
  let result = { uuids: [], rfcs: [], hasText: false }, failure = '';
  if (satToken) {
    announce('Leyendo folios fiscales en el PDF…');
    try { result = await satApi('pdf-analyze', { data: encode64(bytes(await file.arrayBuffer())) }); }
    catch (error) { failure = error.message; }
  }
  const candidates = Array.isArray(result.uuids) ? result.uuids : [];
  const known = Array.isArray(result.rfcs) ? result.rfcs : [];
  const automatic = candidates.length === 1 ? candidates[0] : '';
  const match = invoices.find(row => row.id === automatic);
  const belongs = candidate => !match || [match.from.rfc, match.to.rfc].includes(candidate);
  const applicable = people.filter(person => belongs(person.id));
  check(applicable.length, 'El XML vinculado pertenece a otro expediente.');
  const suitable = applicable.filter(p => known.includes(p.id));
  const options = [['', 'Selecciona un RFC'], ...applicable.map(p => [p.id, p.name + ' · ' + p.id])];
  const taxpayer = select(options, scope && applicable.some(p => p.id === scope) ? scope :
    suitable.length === 1 ? suitable[0].id : applicable.length === 1 ? applicable[0].id : '');
  taxpayer.required = true;
  const issueDate = input('date', { value: match?.date.slice(0, 10) || '', required: true });
  const folio = input('text', { value: automatic, maxLength: 36, placeholder: 'UUID del CFDI, si está disponible' });
  if (scope && ((match && !belongs(scope)) || (!match && known.length && !known.includes(scope)))) {
    announce('El PDF no corresponde al RFC seleccionado ' + scope + '. RFC detectados: ' + (known.join(', ') || [match.from.rfc, match.to.rfc].join(', ')), true);
    return viewPdfFile(file);
  }
  const note = failure || (automatic ? match ? 'Encontré el XML del mismo UUID. Revisa los datos para vincular la representación impresa.' :
    'Detecté un UUID. El PDF se vinculará cuando exista el XML correspondiente.' :
    candidates.length ? 'El PDF contiene varios UUID. Escribe el folio correcto para vincularlo.' :
    'No pude identificar un UUID. Si es un escaneo, captura el folio manualmente o guarda el PDF sin vincular.');
  reportPdfState(note);
  dialog('Archivar factura PDF', [cell(file.name, note), field('Expediente', taxpayer),
    field('Fecha del comprobante', issueDate), field('UUID (opcional)', folio)], async () => {
    const uuid = folio.value.trim().toUpperCase();
    check(!uuid || UUID.test(uuid), 'El UUID debe tener 36 caracteres en formato de folio fiscal.');
    const linked = invoices.find(row => row.id === uuid);
    check(!linked || [linked.from.rfc, linked.to.rfc].includes(taxpayer.value), 'El XML de ese UUID corresponde a otro RFC.');
    check(!known.length || linked || known.includes(taxpayer.value), 'El RFC seleccionado no aparece en el PDF.');
    check(!uuid || !documents.some(doc => doc.kind === 'Factura PDF' && doc.rfc === taxpayer.value && doc.uuid === uuid),
      'Ese UUID ya tiene una factura PDF en este expediente.');
    const id = 'pdf:' + crypto.randomUUID();
    const row = { id, rfc: taxpayer.value, kind: 'Factura PDF', date: issueDate.value,
      period: '', name: file.name.slice(0, 180), uuid };
    await writeBatch({ documents: [row], files: [{ id, blob: new Blob([file], { type: 'application/pdf' }) }] });
    docFilter = 'Factura PDF';
    if (scope && scope !== taxpayer.value) scope = taxpayer.value;

function addPerson() {
  check(ready, 'El almacenamiento todavía no está disponible.');
  const name = input('text', { required: true, maxLength: 120, placeholder: 'Nombre o razón social' });
  const id = input('text', { required: true, maxLength: 13, placeholder: 'RFC de 12 o 13 caracteres' });
  const note = n('p', '', 'rfc-note');
  const confirmDigit = input('checkbox');
  const confirmField = field('Guardar aunque el dígito verificador no cuadre', confirmDigit);
  confirmField.hidden = true;
  const hint = 'Al escribir se revisan la estructura, la fecha y el dígito verificador oficial. ' +
    'La revisión es de forma: no confirma que el RFC exista en el SAT.';
  const paint = () => {
    const result = validateRfc(id.value);
    confirmField.hidden = !(result.level === 'digit' && !result.generic);
    if (!id.value.trim()) { note.dataset.state = 'info'; note.textContent = hint; }
    else if (result.level === 'structure') { note.dataset.state = 'error'; note.textContent = result.error; }
    else if (result.generic) {
      note.dataset.state = 'info';
      note.textContent = 'Es uno de los RFC genéricos del SAT (público en general u operaciones con extranjeros): ' +
        'se acepta con esta nota y no se le exige el dígito verificador.';
    } else if (result.level === 'digit') {
      note.dataset.state = 'warn';
      note.textContent = 'El dígito verificador no cuadra: para esta base debería ser «' + result.digitExpected + '» y trae «' +
        result.rfc.slice(-1) + '». Casi siempre es una errata al teclear. Revisa el RFC y, solo si estás seguro de que así consta, ' +
        'marca la casilla para guardarlo de todos modos.';
    } else {
      note.dataset.state = 'ok';
      note.textContent = 'Válido en forma: estructura, fecha y dígito verificador correctos (' +
        (result.type === 'fisica' ? 'persona física' : 'persona moral') + '). Esto no confirma que el RFC exista en el SAT.';
    }
    return result;

async function satApi(route, data) {
  const headers = { 'X-PacoSAT-Token': satToken };
  if (data !== undefined) headers['Content-Type'] = 'application/json';
  const response = await fetch('/api/' + route, {
    method: data === undefined ? 'GET' : 'POST', headers,
    body: data === undefined ? undefined : JSON.stringify(data)
  });
  if (!response.ok) {
    const failed = await response.json().catch(() => ({}));
    const error = new Error(failed.error || 'El servicio local no respondió.');
    error.guard = failed.guard || null;
    throw error;
  }
  return response.headers.get('Content-Type') === 'application/zip' ? response.blob() : response.json();
}

/* Anillo de estados (1.6.5): resume los mismos datos de la vigilancia

function fiscalStateCounts(rows) {
  const counts = { vigente: 0, cancelado: 0, efos: 0, sin: 0 };
  for (const row of rows) {
    const state = invoiceStateOf(row);
    if (state === 'efos') counts.efos++;

    else if (state === 'Cancelado') counts.cancelado++;

function donutSegments(counts) {
  const order = [['vigente', 'Vigentes'], ['cancelado', 'Cancelados'], ['efos', 'Con 69-B'], ['sin', 'Sin consulta']];
  const total = order.reduce((sum, [key]) => sum + (counts[key] || 0), 0);
  let acc = 0;
  return order.map(([key, label]) => {
    const value = counts[key] || 0;
    const frac = total ? value / total : 0;
    const segment = { key, label, value, frac, start: acc };
    acc += frac;
    return segment;
  });
}

  svg.append(el('title', {}, 'Estados de ' + total + ' CFDI según la vigilancia SAT'));

  if (satData.coverage === undefined && !satError) {

    const wrap = panel('Cobertura de descarga');
    const skel = n('div', undefined, 'skel');
    skel.setAttribute('aria-busy', 'true');
    skel.setAttribute('aria-label', 'Cargando la cobertura de descarga');
    for (let i = 0; i < 3; i++) skel.append(n('div', undefined, 'skel-block'));
    wrap.append(skel);
    return [wrap];
  }
  const coverage = satData.coverage || { groups: [], gaps: [], days: {} };
  const visible = coverage.groups.filter(group => !scope || group.rfc === scope);
  const screens = [];
  const table = panel('Verificado por RFC y sentido');
  if (!visible.length) table.append(empty('Sin solicitudes todavía', 'Cuando el Centro SAT descargue periodos, aquí verás hasta dónde está verificado cada RFC y qué sigue en curso o falló.'));
  else table.append(grid(['RFC', 'Sentido', 'Verificado hasta', 'Tramos cubiertos', 'En curso', 'Fallidos', 'Criterios agotados'],
    visible.map(group => [group.rfc, group.direction === 'received' ? 'Recibidos' : 'Emitidos',
      group.verifiedUntil ? group.verifiedUntil.slice(0, 16) : '—', String(group.covered.length),
      String(group.pending), String(group.failed), String(group.exhausted)])));
  screens.push(table);
  const gapsPanel = panel('Huecos sin descargar');
  const gaps = coverage.gaps.filter(gap => !scope || gap.rfc === scope);
  if (!gaps.length) gapsPanel.append(n('p', 'Sin huecos: en cada RFC y sentido, los tramos descargados forman una cadena continua.'));
  else {
    gapsPanel.append(n('p', 'PacoSAT no solicita estos tramos por su cuenta: quedan anotados en la bitácora cuando aparecen. Para cubrir uno, pídelo desde el Centro SAT; si el criterio exacto ya se envió, desplaza un extremo un segundo.'));
    const duration = seconds => seconds < 90 ? seconds + ' s' : seconds < 5400 ? Math.round(seconds / 60) + ' min' :
      seconds < 172800 ? (seconds / 3600).toFixed(1).replace('.', ',') + ' h' : Math.round(seconds / 86400) + ' días';
    gapsPanel.append(grid(['RFC', 'Sentido', 'Hueco', 'Duración', 'Tipo'], gaps.map(gap => [gap.rfc,
      gap.direction === 'received' ? 'Recibidos' : 'Emitidos',
      gap.from.slice(0, 10) === gap.to.slice(0, 10) ? gap.from.slice(0, 16) + ' → ' + gap.to.slice(11, 16) :
        gap.from.slice(0, 16) + ' → ' + gap.to.slice(0, 16),
      duration(gap.seconds), gap.micro ? 'Micro-hueco · costura del blindaje ±1 s' : 'Hueco'])));
  }
  screens.push(gapsPanel);
  const rfcs = [...new Set([...visible.map(group => group.rfc), ...Object.keys(coverage.days)])].filter(rfc => !scope || rfc === scope).sort();
  for (const rfc of rfcs) screens.push(coverageHeatmap(rfc, coverage.days[rfc] || { received: [], issued: [] }));
  return screens;
}
function coverageHeatmap(rfc, daysForRfc) {
  const wrap = panel('Mapa anual de días cubiertos · ' + rfc);
  const received = new Set(daysForRfc.received || []), issued = new Set(daysForRfc.issued || []);
  const years = [...new Set([...received, ...issued].map(date => date.slice(0, 4)))].sort();
  const year = years.includes(coverageYear) ? coverageYear : (years.length ? years[years.length - 1] : String(new Date().getFullYear()));
  if (years.length > 1) {
    const picker = n('div', undefined, 'actions');
    const select = n('select');
    for (const option of years) { const node = n('option', option); node.value = option; select.append(node); }
    select.value = year;
    select.onchange = () => { coverageYear = select.value; render(); };
    picker.append(n('label', 'Año'), select);
    wrap.append(picker);
  }
  if (!received.size && !issued.size) {
    wrap.append(empty('Sin días cubiertos', 'Cuando una solicitud de este RFC termine, sus días se pintan aquí.'));
    return wrap;
  }
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  const el = (tag, attrs, text) => {
    const node = document.createElementNS(NS, tag);
    for (const [name, value] of Object.entries(attrs || {})) node.setAttribute(name, value);
    if (text) node.textContent = text;
    return node;
  };
  const cell = 11, pitch = 14, top = 16;
  const jan1 = Date.UTC(Number(year), 0, 1);
  const firstSunday = jan1 - new Date(jan1).getUTCDay() * 86400000;
  const weeks = Math.ceil(((Date.UTC(Number(year), 11, 31) - firstSunday) / 86400000 + 1) / 7);
  svg.setAttribute('viewBox', '0 0 ' + (weeks * pitch + 2) + ' ' + (top + 7 * pitch));
  svg.setAttribute('class', 'hm'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Mapa de calor de días con descarga cubierta en ' + year + ' para ' + rfc);
  svg.append(el('title', {}, 'Días cubiertos en ' + year + ' · ' + rfc));
  const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  for (let month = 0; month < 12; month++) {
    const first = Date.UTC(Number(year), month, 1);
    const week = Math.floor((first - firstSunday) / (7 * 86400000));
    svg.append(el('text', { x: week * pitch + 1, y: 10 }, months[month]));
  }
  for (let offset = 0; offset < 371; offset++) {
    const date = new Date(firstSunday + offset * 86400000);
    if (date.getUTCFullYear() !== Number(year)) continue;
    const key = date.toISOString().slice(0, 10);
    const level = (received.has(key) ? 1 : 0) + (issued.has(key) ? 1 : 0);
    const rect = el('rect', { x: Math.floor(offset / 7) * pitch + 1, y: top + (offset % 7) * pitch + 1,
      width: cell, height: cell, rx: 2, class: 'hm-l' + level });
    rect.append(el('title', {}, key + ' · recibidos: ' + (received.has(key) ? 'cubierto' : 'sin cubrir') +
      ' · emitidos: ' + (issued.has(key) ? 'cubierto' : 'sin cubrir')));
    svg.append(rect);
  }
  const scroll = n('div', undefined, 'hm-scroll'); scroll.append(svg);
  const legend = n('div', undefined, 'chart-legend');
  const item = (cls, label) => { const span = n('span'); span.append(n('i', undefined, cls), document.createTextNode(label)); return span; };
  legend.append(item('sw-hm0', 'Sin cubrir'), item('sw-hm1', 'Un sentido'), item('sw-hm2', 'Recibidos y emitidos'));
  wrap.append(scroll, legend);
  return wrap;
}
