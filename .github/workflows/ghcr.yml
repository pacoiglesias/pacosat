name: Publicar imagen Docker en GHCR

# La imagen de PacoSAT se construye en GitHub y se publica en GHCR al
# fusionar a main: el NAS solo descarga y recrea (docker compose pull),
# ya no compila en su propio procesador. La configuración y los
# secretos viven SOLO en el NAS; este workflow no accede a él.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Leer la versión de package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Generar el paquete del ejecutor (ejecutor-bundle.zip)
        run: |
          npm ci
          node construir-bundle.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pacoiglesias/pacosat:${{ steps.version.outputs.version }}
            ghcr.io/pacoiglesias/pacosat:latest
            ghcr.io/pacoiglesias/pacosat:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
