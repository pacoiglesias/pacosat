name: Validación
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: git diff --exit-code -- Faro-Fiscal.html xml-core.mjs
